<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const toFa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const N='تهران،اصفهان،شیراز،تبریز،مشهد،یزد،کاشان،رشت،اهواز،کرمان،استانبول،آنکارا،دبی،ابوظبی،دوحه،ریاض،جده،مسقط،بغداد،دمشق،بیروت،قاهره،اسکندریه،کازابلانکا،مراکش،تونس،آتن،رم،میلان،ونیز،فلورانس،پاریس،لیون،مارسی،مادرید،بارسلونا،لیسبون،پورتو،لندن،منچستر،ادینبورو،دوبلین،آمستردام،بروکسل،برلین،مونیخ،هامبورگ،وین،زوریخ،ژنو،پراگ،بوداپست،ورشو،کراکوف،استکهلم،اسلو،کپنهاگ،هلسینکی،مسکو،سن‌پترزبورگ،کی‌یف،باکو،تفلیس،ایروان،تاشکند،سمرقند،بخارا،آلماتی،کابل،اسلام‌آباد،لاهور،دهلی،بمبئی،کلکته،کاتماندو،کلمبو،داکا،بانکوک،هانوی،سایگون،سنگاپور،کوالالامپور،جاکارتا،مانیل،پکن،شانگهای،هنگ‌کنگ،سئول،توکیو،اوزاکا،کیوتو،سیدنی،ملبورن،اوکلند،نیویورک،بوستون،شیکاگو،واشنگتن،میامی،لس‌آنجلس،سان‌فرانسیسکو،لاس‌وگاس،سیاتل،ونکوور،تورنتو،مکزیکوسیتی،هاوانا،بوگوتا،لیما،ریودوژانیرو،بوئنوس‌آیرس،سانتیاگو،کیپ‌تاون،نایروبی،لاگوس'.split('،');
const CITY_M=300;
const cname=i=>N[i%N.length]+(i>=N.length?' '+toFa(Math.floor(i/N.length)+1):'');
// ---- helpers ----
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function hsl(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[f(0)*255,f(8)*255,f(4)*255]}
const rgb=c=>'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';
const mix=(a,b,t)=>a.map?a.map((v,i)=>v+(b[i]-v)*t):a+(b-a)*t;
function style(i){const r=rng(i*977+5),h=(i*137.5+r()*25)%360,tod=i%4,n=tod===2;
 const sk=[[hsl(205+r()*25,75,58),hsl(190,65,82)],[hsl(270+r()*40,50,32),hsl(15+r()*20,90,64)],[hsl(240,60,7),hsl(250+r()*30,55,22)],[hsl(320+r()*20,45,44),hsl(40,85,76)]][tod];
 return{i,tod,top:sk[0],bot:sk[1],ground:hsl(h,35,n?13:30),gl:hsl(h,50,n?28:50),
  far:hsl(h,28,n?14:tod===1?30:58),mid:hsl(h+20,35,n?10:tod===1?22:44),near:hsl(h+40,40,n?6:16),
  win:n||tod===1?[255,226,110]:[170,220,255],roof:Math.floor(r()*4),w0:12+r()*8,w1:14+r()*26,hm:.35+r()*.45,lm:i%6,
  star:n?1:0,orb:[[255,240,150],[255,110,50],[225,230,255],[255,200,120]][tod],oy:[.2,.5,.14,.45][tod]}}
// ---- audio ----
let AC,master,muted=ls('cr_m')==='1',mt=0;
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination)}catch(e){}}if(AC&&AC.state!=='running')AC.resume()}
function tone(f,d,ty,v,f2){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d)}
function noise(d,v){if(!AC||muted)return;const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(master);s.start()}
const mf=n=>440*Math.pow(2,(n-69)/12);
function sfx(k){if(k==='jump')tone(300,.13,'square',.12,700);else if(k==='dj')tone(450,.12,'square',.12,900);else if(k==='slide')noise(.12,.15);
 else if(k==='coin'){tone(988,.07,'square',.12);setTimeout(()=>tone(1319,.12,'square',.12),60)}
 else if(k==='crash'){noise(.5,.5);tone(200,.5,'sawtooth',.2,40)}
 else if(k==='city'){[0,4,7,12,16].forEach((x,i)=>setTimeout(()=>tone(mf(69+x),.14,'square',.12),i*70))}}
setInterval(()=>{if(!AC||muted||AC.state!=='running'||state!=='play')return;const r=57+(cityI*5)%12,pat=[0,7,12,7,3,10,15,10],st=mt++%16,bar=(mt>>4)%4;
 if(st%2===0)tone(mf(r-12+[0,0,5,7][bar]),.12,'square',.06);tone(mf(r+pat[st%8]+(st>7?12:0)),.09,'square',.04);if(st%4===2)noise(.04,.05)},125);

// ---- wallet & skins ----
const RAR={common:['معمولی','#b0b8c4'],rare:['کمیاب','#4aa8ff'],epic:['حماسی','#b45cff'],legend:['افسانه‌ای','#ffb020'],mythic:['اسطوره‌ای','#ff3d7f']};
const SKN=[
{n:'قهرمان',r:'common',p:0,sh:'#e53935',pa:'#2255cc',sk:'#ffcc99',hr:'#4a2f1b'},
{n:'سبزپوش',r:'common',p:40,sh:'#2e9e44',pa:'#274a8a',sk:'#f2c29b',hr:'#222'},
{n:'آبی‌پوش',r:'common',p:60,sh:'#2a7de1',pa:'#333',sk:'#e0a878',hr:'#6b3a1a'},
{n:'زرد برقی',r:'common',p:80,sh:'#f5c518',pa:'#444',sk:'#ffd1a8',hr:'#a0522d',fx:1},
{n:'نینجا',r:'rare',p:250,sh:'#1d1d24',pa:'#1d1d24',sk:'#ffcc99',hr:'#111',acc:1},
{n:'ربات',r:'rare',p:300,sh:'#9aa7b4',pa:'#5d6b78',sk:'#c6d2dc',hr:'#5d6b78',acc:2},
{n:'یخی',r:'rare',p:350,sh:'#7fd8ff',pa:'#3b6fb3',sk:'#e8f6ff',hr:'#fff',fx:1},
{n:'فضانورد',r:'epic',p:700,sh:'#f2f2f2',pa:'#d9d9d9',sk:'#ffcc99',hr:'#bbb',acc:3,fx:1},
{n:'شوالیه',r:'epic',p:900,sh:'#9aa0a8',pa:'#6b7078',sk:'#ffcc99',hr:'#9aa0a8',acc:3,fx:1},
{n:'جادوگر',r:'epic',p:1000,sh:'#6a2fc4',pa:'#3b1b78',sk:'#ffcc99',hr:'#eee',acc:9,fx:4},
{n:'شاه',r:'legend',p:1800,sh:'#7a1fa2',pa:'#c9a400',sk:'#ffcc99',hr:'#ffd700',acc:4,fx:1,cape:'#c0143c'},
{n:'اژدها',r:'legend',p:2400,sh:'#1f9d55',pa:'#0f5a32',sk:'#7ddc8a',hr:'#0f5a32',acc:5,fx:2},
{n:'فرشته',r:'legend',p:2800,sh:'#ffffff',pa:'#f7e9b8',sk:'#ffe2c4',hr:'#ffd700',acc:6,fx:1,cape:'#ffffff'},
{n:'ققنوس',r:'mythic',p:4500,sh:'#ff5a1f',pa:'#c1121f',sk:'#ffb27a',hr:'#ffd400',acc:5,fx:2,cape:'#ff8a00'},
{n:'کهکشان',r:'mythic',p:6000,sh:'#2b1b6e',pa:'#150e3a',sk:'#9fd0ff',hr:'#ffffff',acc:6,fx:4,cape:'#5b2cc9'},
{n:'رنگین‌کمان',r:'mythic',p:8000,sh:'rb',pa:'rb2',sk:'#ffcc99',hr:'#ffffff',acc:4,fx:3,cape:'rb'}];
let wallet=+ls('cr_w')||0,eq=+ls('cr_e')||0,owned;try{owned=JSON.parse(ls('cr_o')||'[0]')}catch(e){owned=[0]}
if(!Array.isArray(owned)||!owned.includes(0))owned=[0].concat(owned||[]);if(!owned.includes(eq))eq=0;
const saveW=()=>{ls('cr_w',wallet);ls('cr_o',JSON.stringify(owned));ls('cr_e',eq)};
const hc=(v,t,o)=>v==='rb'?'hsl('+(((t||0)*120+(o||0))%360|0)+',90%,60%)':v==='rb2'?'hsl('+((((t||0)*120)+180)%360|0)+',90%,50%)':v;
function drawHero(c,x,y,k,fr,du,air,t){const Q=(a,b,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(a),Math.round(b),w,h)};
 const sh=hc(k.sh,t),pa=hc(k.pa,t),ac=k.acc||0;
 if(k.cape)Q(x-8,y-12,5,du?4:9,hc(k.cape,t,60));
 if(du){Q(x-6,y-8,12,6,sh);Q(x+3,y-10,6,6,k.sk);Q(x+3,y-11,6,2,k.hr);Q(x-8,y-3,4,3,pa);
  if(ac===1)Q(x+3,y-9,6,1,'#e53935');if(ac===2)Q(x+5,y-9,4,2,'#35f2ff');if(ac===3)Q(x+2,y-12,8,3,'#cfd8e3');if(ac===4)Q(x+3,y-13,6,2,'#ffd700');if(ac===5)Q(x+3,y-14,1,3,'#fff');if(ac===6)Q(x+3,y-13,6,1,'#ffe066');if(ac===9)Q(x+3,y-13,6,2,'#3b1b78')}
 else{Q(x-3,y-16,6,5,k.sk);Q(x-3,y-17,6,2,k.hr);Q(x-4,y-11,8,6,sh);Q(x-6,y-10,2,4,k.sk);Q(x+4,y-10,2,4,k.sk);
  if(air){Q(x-4,y-5,3,4,pa);Q(x+1,y-4,3,4,pa)}else if(fr){Q(x-4,y-5,3,5,pa);Q(x+1,y-5,3,3,pa)}else{Q(x-3,y-5,3,3,pa);Q(x+1,y-5,3,5,pa)}
  if(ac===1){Q(x-3,y-15,6,1,'#e53935');Q(x-6,y-15,3,1,'#e53935')}
  if(ac===2)Q(x-3,y-15,6,2,'#35f2ff');
  if(ac===3){Q(x-4,y-18,8,2,'#cfd8e3');Q(x-4,y-18,1,7,'#cfd8e3');Q(x+3,y-18,1,7,'#cfd8e3');Q(x-2,y-15,5,3,'#35f2ff')}
  if(ac===4){Q(x-3,y-19,6,2,'#ffd700');Q(x-3,y-20,1,1,'#ffd700');Q(x-1,y-20,1,1,'#ffd700');Q(x+2,y-20,1,1,'#ffd700')}
  if(ac===5){Q(x-4,y-19,1,3,'#fff');Q(x+3,y-19,1,3,'#fff')}
  if(ac===6)Q(x-3,y-20,6,1,'#ffe066');
  if(ac===9){Q(x-5,y-18,10,1,'#3b1b78');Q(x-3,y-20,6,2,'#6a2fc4');Q(x-1,y-23,3,3,'#6a2fc4')}}}
let fxp=[];
function emitFx(k,x,y){if(!k.fx)return;const r=Math.random;if(r()>.7)return;const f=k.fx;
 fxp.push({x:x-3,y:y-6-r()*8,vx:-20-r()*20,vy:f===2?-20-r()*30:(r()-.5)*20,l:.5+r()*.3,c:f===1?(r()<.5?'#ffe24a':'#fff'):f===2?(r()<.5?'#ff7a00':'#ffd400'):f===3?'hsl('+((performance.now()/4)%360|0)+',90%,60%)':(r()<.5?'#fff':'#b45cff')})}
const EMB=window.parent!==window&&location.href==='about:srcdoc';
function post(type,score,won){if(!EMB)return;try{parent.postMessage({source:'nova-arcade-embed',game:'cityrun',type,score:score||0,won:!!won},'*')}catch(e){}}
// ---- screen ----
let LW,LH,GY;
function rs(){const W=innerWidth,H=innerHeight;if(H>W){LW=240;LH=Math.round(240*H/W)}else{LH=240;LW=Math.round(240*W/H)}cv.width=LW;cv.height=LH;GY=Math.round(LH*.76)}
addEventListener('resize',rs);rs();
// ---- state ----
let lastPost=-1,pv='',state='menu',cam=0,cityI=0,cur=style(0),pal,L,lmq,stars,obs,coins,nextX,py,vy,dj,duck,coinN,dead=0,best=+ls('cr_best')||0,flash=0,shake=0;let shownScore='',shownCoins=-1;
const sr=rng(7);stars=Array.from({length:40},()=>({x:sr()*400,y:sr()*.6}));
const LAY=[{p:.15,k:'far',hs:.6,ws:.8},{p:.35,k:'mid',hs:.85,ws:1},{p:.7,k:'near',hs:.45,ws:1.3}];
function reset(){cam=0;cityI=0;cur=style(0);pal={top:cur.top,bot:cur.bot,ground:cur.ground,gl:cur.gl,star:cur.star,orb:cur.orb,oy:cur.oy};
 L=LAY.map(l=>({...l,it:[],nx:0}));lmq=null;obs=[];coins=[];nextX=420;py=GY;vy=0;dj=0;duck=0;coinN=0;flash=0}
reset();
// ---- world ----
function fillLayer(l){const st=cur,r=Math.random;
 while(l.nx-cam*l.p<LW+80){let w=Math.round((st.w0+r()*st.w1)*l.ws),h=Math.round((.25+r()*.75)*GY*st.hm*l.hs),c=rgb(st[l.k]),lm=-1;
  if(l.k==='mid'&&lmq){lm=lmq;lmq=null;w=44;h=Math.round(GY*.5);c=rgb(mix(st.mid,[0,0,0],.25))}
  const it={x:l.nx,w,h,c,roof:st.roof,win:rgb(st.win),s:(r()*1000)|0,lm,far:l.k==='far'};if(!it.far&&lm<0){it.wn=[];for(let wx=3;wx<w-5;wx+=5)for(let wy=4;wy<h-4;wy+=6)if(((it.s+wx*7+wy*13)%5)<2)it.wn.push([wx,wy])}l.it.push(it);l.nx+=w+Math.round(r()*5)}
 while(l.it.length&&l.it[0].x+l.it[0].w<cam*l.p-30)l.it.shift()}
function spawn(v){const r=Math.random,b=nextX,d=cam>5000,t=Math.floor(r()*(d?7:5));
 const crate=x=>obs.push({x,t:'c',w:12,h:12}),tall=x=>obs.push({x,t:'t',w:10,h:26}),sign=x=>obs.push({x,t:'s',w:14,h:GY-11});
 if(t===0){crate(b);for(let k=-1;k<=1;k++)coins.push({x:b+k*10,y:GY-32-(k?0:5)})}
 else if(t===1){tall(b);for(let k=-1;k<=1;k++)coins.push({x:b+k*10,y:GY-44-(k?0:5)})}
 else if(t===2){sign(b);for(let k=0;k<4;k++)coins.push({x:b-8+k*11,y:GY-6})}
 else if(t===3){crate(b);crate(b+28);coins.push({x:b+14,y:GY-40})}
 else if(t===4){for(let k=0;k<6;k++)coins.push({x:b+k*12,y:GY-8-Math.sin(k/5*Math.PI)*28})}
 else if(t===5){crate(b);sign(b+105)}
 else{tall(b);crate(b+80);sign(b+160)}
 nextX=b+170+r()*120+v*.5}
function newCity(i){cityI=i;cur=style(i);lmq=cur.lm;sfx('city');const bn=$('banner');bn.textContent='شهر '+toFa(i+1)+' · '+cname(i);bn.classList.remove('show');void bn.offsetWidth;bn.classList.add('show');$('ci').textContent='🏙 '+(i+1)+' '+cname(i)}
// ---- update ----
function speed(){return Math.min(220,120+cam/400)}
function jump(){if(state!=='play')return;if(py>=GY-.5){vy=-310;duck=0;sfx('jump')}else if(!dj){dj=1;vy=-270;sfx('dj')}}

 setTimeout(()=>{$('ov').style.display='flex';$('ov').innerHTML='<h1>GAME OVER</h1><p>امتیاز: '+sc+'<br>مسافت: '+toFa(m)+' متر ・ سکه: '+toFa(coinN)+'<br>رسیدی به شهر '+toFa(cityI+1)+': '+cname(cityI)+'<br>رکورد: '+best+'<br>🪙 +'+toFa(g)+' (کیف: '+toFa(wallet)+')</p><button class="btn" id="go2">↻ دوباره</button><button class="btn b2" id="go3">☰ منو</button>';$('go2').onclick=start;$('go3').onclick=toMenu},700)}
function start(){initAudio();reset();lastPost=-1;shownScore='';shownCoins=-1;post('start');state='play';$('ov').style.display='none';$('ci').textContent='🏙 1 '+cname(0);const bn=$('banner');bn.textContent='شهر ۱ · '+cname(0);bn.classList.remove('show');void bn.offsetWidth;bn.classList.add('show')}
function update(dt){const v=state==='play'?speed():state==='menu'?70:0;cam+=v*dt;
 if(state==='play'){vy+=900*dt;py+=vy*dt;if(py>=GY){py=GY;vy=0;dj=0}if(duck>0)duck-=dt;
  const m=Math.floor(cam/8),ci=Math.floor(m/CITY_M);if(ci!==cityI)newCity(ci);
  while(nextX<cam+LW+120)spawn(v);
  while(obs.length&&obs[0].x<cam-60)obs.shift();while(coins.length&&coins[0].x<cam-60)coins.shift();
  const px=cam+48,du=duck>0&&py>=GY-1,pl=du?px-6:px-4,pw=du?12:8,pt=py-(du?8:16);
  for(const o of obs){if(o.x>px+30)break;const oy=o.t==='s'?0:GY-o.h;if(pl+pw-1>o.x+1&&pl+1<o.x+o.w-1&&py-1>oy&&pt+1<oy+o.h){die();break}}
  for(const c of coins){if(c.got)continue;if(c.x>px+20)break;if(Math.abs(c.x-px)<9&&Math.abs(c.y-(py-8))<12){c.got=1;coinN++;sfx('coin')}}
  emitFx(SKN[eq],48,py);const scr=m+coinN*10;if(scr!==shownScore){shownScore=scr;$('sc').textContent=scr+' m'}if(coinN!==shownCoins){shownCoins=coinN;$('co').textContent='🪙 '+coinN}if(scr!==lastPost){lastPost=scr;post('score',scr)}}
 for(const q of fxp){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt}fxp=fxp.filter(q=>q.l>0);if(state==='dead')fxp=[];
 {const vis=(state==='play'||state==='pause')?'visible':'hidden';if(vis!==pv){pv=vis;$('mn').style.visibility=vis}}
 const k=1-Math.exp(-dt*2.5);for(const a of ['top','bot','ground','gl','orb'])pal[a]=mix(pal[a],cur[a],k);pal.star=mix(pal.star,cur.star,k);pal.oy=mix(pal.oy,cur.oy,k);
 L.forEach(fillLayer);if(flash>0)flash-=dt*2;if(shake>0)shake-=dt}
// ---- draw ----
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function tri(cx,bw,h,by){for(let y=0;y<h;y++){const w=Math.max(1,Math.round(bw*(1-y/h)));ctx.fillRect(Math.round(cx-w/2),by-y-1,w,1)}}
function disc(cx,cy,r){for(let j=-r;j<=r;j++){const w=Math.round(Math.sqrt(r*r-j*j));ctx.fillRect(cx-w,cy+j,w*2,1)}}
function drawLM(sx,it){const cx=sx+22,h=it.h,t=it.lm;ctx.fillStyle=it.c;
 if(t===0){tri(cx,34,h,GY);ctx.fillRect(cx,GY-h-6,1,6)}
 else if(t===1){tri(cx,52,Math.round(h*.7),GY);tri(cx+14,26,Math.round(h*.4),GY)}
 else if(t===2){ctx.fillRect(cx-14,GY-20,28,20);for(let j=0;j<10;j++){const w=Math.round(10*Math.sqrt(1-j*j/100));ctx.fillRect(cx-w,GY-21-j,w*2,1)}ctx.fillRect(cx-21,GY-h,3,h);ctx.fillRect(cx+18,GY-h,3,h);tri(cx-20,6,6,GY-h);tri(cx+19,6,6,GY-h)}
 else if(t===3){for(let k=0;k<4;k++){const w=34-k*7,y=GY-k*12;ctx.fillRect(cx-w/2-2,y-12,w+4,3);ctx.fillRect(cx-w/2+3,y-9,w-6,9)}ctx.fillRect(cx,GY-54,1,8)}
 else if(t===4){ctx.fillRect(cx-8,GY-h,16,h);ctx.fillRect(cx-4,GY-h-14,8,14);ctx.fillRect(cx,GY-h-26,1,12)}
 else{ctx.fillRect(cx-8,GY-h,16,h);tri(cx,22,12,GY-h);R(cx-4,GY-h+8,8,8,'#eee');R(cx,GY-h+9,1,4,'#222');R(cx,GY-h+12,3,1,'#222')}}
function drawItem(it,l){const sx=Math.round(it.x-cam*l.p),y0=GY-it.h;if(sx>LW||sx+it.w<0)return;
 if(it.lm>=0){drawLM(sx,it);return}
 ctx.fillStyle=it.c;ctx.fillRect(sx,y0,it.w,it.h);ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(sx+it.w-3,y0,3,it.h);ctx.fillStyle=it.c;
 const rf=it.roof,w=it.w;
 if(rf===1)ctx.fillRect(sx+(w>>1),y0-9,1,9);
 else if(rf===2){ctx.fillRect(sx+3,y0-4,w-6,4);ctx.fillRect(sx+6,y0-8,Math.max(2,w-12),4)}
 else if(rf===3){for(let j=0;j<6;j++){const ww=Math.round(w/2*Math.sqrt(1-j*j/36));ctx.fillRect(sx+(w>>1)-ww,y0-1-j,ww*2,1)}}
 if(it.wn&&it.wn.length){ctx.fillStyle=it.win;for(const p of it.wn)ctx.fillRect(sx+p[0],y0+p[1],2,3)}}
function draw(t){ctx.setTransform(1,0,0,1,0,0);if(shake>0)ctx.translate(Math.round((Math.random()-.5)*4),Math.round((Math.random()-.5)*4));
 const B=28;for(let i=0;i<B;i++){ctx.fillStyle=rgb(mix(pal.top,pal.bot,i/(B-1)));const y0=Math.floor(i*GY/B),y1=Math.floor((i+1)*GY/B);ctx.fillRect(0,y0,LW,y1-y0+1)}
 if(pal.star>.05){ctx.fillStyle='rgba(255,255,255,'+pal.star+')';stars.forEach((s,i)=>{if(((t*2+i)|0)%7)ctx.fillRect(Math.round((s.x-cam*.02)%LW+LW)%LW,Math.round(s.y*GY),1,1)})}
 ctx.fillStyle=rgb(pal.orb);disc(Math.round(LW*.75),Math.round(GY*pal.oy)+10,10);
 L.forEach(l=>l.it.forEach(it=>drawItem(it,l)));
 R(0,GY,LW,LH-GY,rgb(pal.ground));R(0,GY,LW,2,rgb(pal.gl));
 ctx.fillStyle='rgba(0,0,0,.2)';for(let x=-16;x<LW+16;x+=16)ctx.fillRect(Math.round(x-cam%16),GY+12,8,2);for(let x=-24;x<LW+24;x+=24)ctx.fillRect(Math.round(x-(cam*1.3)%24),GY+28,12,2);
 for(const o of obs){const sx=Math.round(o.x-cam);if(sx>LW+20||sx<-30)continue;
  if(o.t==='c'){R(sx,GY-12,12,12,'#000');R(sx+1,GY-11,10,10,'#c7822f');R(sx+1,GY-11,10,2,'#e8a74e');R(sx+5,GY-11,2,10,'#8a5316');R(sx+1,GY-6,10,2,'#8a5316')}
  else if(o.t==='t'){R(sx,GY-26,10,26,'#000');for(let k=0;k<4;k++){R(sx+1,GY-25+k*6,8,3,'#ffd400');R(sx+1,GY-22+k*6,8,3,'#222')}}
  else{R(sx+6,0,2,GY-24,'#888');R(sx,GY-24,14,13,'#000');R(sx+1,GY-23,12,11,'#e53935');R(sx+6,GY-21,2,5,'#fff');R(sx+6,GY-14,2,2,'#fff')}}
 for(const c of coins){if(c.got)continue;const sx=Math.round(c.x-cam);if(sx>LW+10||sx<-10)continue;const w=Math.abs(Math.round(Math.cos(t*6+c.x*.1)*3))+1;R(sx-w,c.y-4,w*2,8,'#a86f00');R(sx-w+1,c.y-3,Math.max(1,w*2-2),6,'#ffd400')}
 // player
 const x=48,y=Math.round(py),du=duck>0&&py>=GY-1,fr=((cam/7)|0)%2;
 for(const q of fxp){ctx.globalAlpha=Math.max(0,q.l*1.6);R(q.x,q.y,2,2,q.c)}ctx.globalAlpha=1;
 drawHero(ctx,x,y,SKN[eq],fr,du,py<GY-1,t);
 if(flash>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(.7,flash)+')';ctx.fillRect(0,0,LW,LH)}}
// ---- loop & input ----
let last=0,lastIdleFrame=0;function loop(ms){if(state!=='play'&&ms-lastIdleFrame<40){requestAnimationFrame(loop);return}lastIdleFrame=ms;const t=ms/1000,dt=Math.min(state==='play'?.033:.05,t-last||.016);last=t;update(dt);draw(t);requestAnimationFrame(loop)}
let sy=0,sg=0;
cv.addEventListener('touchstart',e=>{e.preventDefault();initAudio();sy=e.touches[0].clientY;sg=0},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(sg)return;const d=e.touches[0].clientY-sy;if(d>25){sg=1;slide()}else if(d<-25){sg=1;jump()}},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();if(!sg)jump()},{passive:false});
let lt=0;cv.addEventListener('touchstart',()=>lt=Date.now());
cv.addEventListener('mousedown',()=>{if(Date.now()-lt>600){initAudio();jump()}});
addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(state==='play')jump()}else if(e.code==='ArrowDown'){e.preventDefault();slide()}});
const sb=$('snd');sb.textContent=muted?'🔇':'🔊';
function toggleMute(){muted=!muted;ls('cr_m',muted?'1':'0');sb.textContent=muted?'🔇':'🔊';initAudio()}
sb.onclick=()=>{toggleMute();if(state==='menu'&&!helpOn)showMenu()};
let helpOn=0;
function showMenu(){helpOn=0;const o=$('ov');o.style.display='flex';o.innerHTML='<h1>CITY RUN</h1><p>🏙 دونده‌ی بی‌پایان در بیش از ۱۰۰ شهر جهان<br>رکورد: '+best+'</p><button class="btn" id="b1">▶ شروع بازی</button><button class="btn b2" id="b5">👕 اسکین‌ها · 🪙 '+toFa(wallet)+'</button><button class="btn b2" id="b2">❓ راهنما</button><button class="btn b2" id="b3">'+(muted?'🔇 صدا: خاموش':'🔊 صدا: روشن')+'</button>'+(EMB?'<button class="btn b2" id="b6">🏠 بازگشت به آرکید</button>':'');
 $('b1').onclick=start;$('b2').onclick=showHelp;$('b5').onclick=()=>showShop();if(EMB)$('b6').onclick=()=>post('home');$('b3').onclick=()=>{toggleMute();showMenu()}}
function showHelp(){helpOn=1;$('ov').innerHTML='<h1>راهنما</h1><p class="hp">👆 ضربه یا بالا کشیدن: پرش<br>✌ ضربه‌ی دوباره در هوا: پرش دوم<br>👇 پایین کشیدن: سُر خوردن (زیر تابلوی قرمز)<br>📦 جعبه و سد: ازشون بپر<br>🪙 هر سکه ۱۰ امتیاز<br>🏙 هر ۳۰۰ متر یک شهر جدید<br>⌨ کامپیوتر: Space یا ↑ پرش، ↓ سُر خوردن<br>☰ دکمه‌ی پایین: بازگشت به منو</p><button class="btn" id="b4">← بازگشت</button>';$('b4').onclick=showMenu}
function toMenu(){reset();state='menu';$('sc').textContent='0 m';$('co').textContent='🪙 0';$('ci').textContent='';$('banner').classList.remove('show');showMenu()}
let shopT=0;
function showShop(msg){helpOn=1;clearInterval(shopT);const o=$('ov');o.style.display='flex';let h='<h1 style="font-size:30px">👕 اسکین‌ها</h1><p>🪙 '+toFa(wallet)+' سکه'+(msg?' · '+msg:'')+'</p><div class="sg">';
 SKN.forEach((k,i)=>{const ow=owned.includes(i),on=eq===i,rc=RAR[k.r];h+='<div class="sk'+(on?' on':'')+'" style="border-color:'+rc[1]+'"><canvas width="32" height="40" data-i="'+i+'"></canvas><b>'+k.n+'</b><small style="color:'+rc[1]+'">'+rc[0]+'</small><button class="b3" data-i="'+i+'">'+(on?'✔ انتخاب شده':ow?'انتخاب':'🪙 '+toFa(k.p))+'</button></div>'});
 h+='</div><button class="btn b2" id="sb">← بازگشت</button>';o.innerHTML=h;
 const paint=()=>{const t=performance.now()/1000;o.querySelectorAll('canvas').forEach(cn=>{const c=cn.getContext('2d');c.clearRect(0,0,32,40);drawHero(c,16,36,SKN[+cn.dataset.i],((t*6)|0)%2,false,false,t)})};
 paint();shopT=setInterval(()=>{if(helpOn!==1||!document.querySelector('.sg')){clearInterval(shopT);return}paint()},150);
 o.querySelectorAll('.b3').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,k=SKN[i];if(owned.includes(i)){eq=i;saveW();sfx('coin');showShop()}else if(wallet>=k.p){wallet-=k.p;owned.push(i);eq=i;saveW();sfx('city');showShop('خریداری شد ✔')}else{sfx('crash');showShop('سکه کافی نیست ❌ ('+toFa(k.p-wallet)+' کم داری)')}});
 $('sb').onclick=showMenu}
function pause(){if(state!=='play')return;state='pause';const o=$('ov');o.style.display='flex';o.innerHTML='<h1 style="font-size:34px">⏸ توقف</h1><p>مسافت: '+toFa(Math.floor(cam/8))+' متر ・ سکه: '+toFa(coinN)+'<br>شهر '+toFa(cityI+1)+': '+cname(cityI)+'</p><button class="btn" id="p1">▶ ادامه</button><button class="btn b2" id="p2">↻ شروع دوباره</button><button class="btn b2" id="p3">🏠 منو</button>';
 $('p1').onclick=resume;$('p2').onclick=()=>{bank();start()};$('p3').onclick=()=>{bank();toMenu()}}
function resume(){if(state!=='pause')return;state='play';$('ov').style.display='none'}
$('mn').onclick=()=>{if(state==='play')pause();else if(state==='pause')resume()};
function syncFSButton(){const d=EMB?parent.document:document;const wide=EMB?d.body.classList.contains('mkfs'):!!(d.fullscreenElement||d.webkitFullscreenElement);$('fs').textContent=wide?'⛶ خروج':'⛶ تمام‌صفحه';$('fs').setAttribute('aria-label',wide?'خروج از تمام‌صفحه':'تمام‌صفحه')}
async function toggleFS(){const d=EMB?parent.document:document;if(EMB){if(d.body.classList.contains('mkfs')){d.body.classList.remove('mkfs');if(d.fullscreenElement||d.webkitFullscreenElement){try{if(d.exitFullscreen)await d.exitFullscreen();else if(d.webkitExitFullscreen)d.webkitExitFullscreen()}catch(e){}}}else{d.body.classList.add('mkfs');if(!(d.fullscreenElement||d.webkitFullscreenElement)){try{const el=d.documentElement;if(el.requestFullscreen)await el.requestFullscreen();else if(el.webkitRequestFullscreen)await el.webkitRequestFullscreen()}catch(e){}}}}else{try{if(d.fullscreenElement||d.webkitFullscreenElement){if(d.exitFullscreen)await d.exitFullscreen();else if(d.webkitExitFullscreen)d.webkitExitFullscreen()}else{const el=d.documentElement;if(el.requestFullscreen)await el.requestFullscreen();else if(el.webkitRequestFullscreen)await el.webkitRequestFullscreen()}}catch(e){}}syncFSButton()}
$('fs').onclick=toggleFS;const fsDoc=EMB?parent.document:document;fsDoc.addEventListener('fullscreenchange',()=>{if(EMB&&!fsDoc.fullscreenElement&&!fsDoc.webkitFullscreenElement)fsDoc.body.classList.remove('mkfs');syncFSButton()});fsDoc.addEventListener('webkitfullscreenchange',()=>{if(EMB&&!fsDoc.fullscreenElement&&!fsDoc.webkitFullscreenElement)fsDoc.body.classList.remove('mkfs');syncFSButton()});syncFSButton();
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
addEventListener('keydown',e=>{if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')pause();else if(state==='pause')resume()}});
$('ci').textContent='';showMenu();requestAnimationFrame(loop);
