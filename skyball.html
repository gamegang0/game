<div id="ov"><h1>SKY BALL</h1><p id="msg">توپ رو روی سکوهای شناور هدایت کن. از تله‌ها بپر و بدون سقوط به پایان مسیر برس. ۱۰۰ مرحله، با سکوهای ناپدیدشونده از مرحله ۸.</p><div id="lv"></div><button id="go">شروع بازی</button><div id="gfxr"></div><button id="shopb" style="background:#ffd24a;box-shadow:0 0 22px rgba(255,210,74,.5)"></button><p style="font-size:13px;opacity:.65">کامپیوتر: فلش‌ها یا WASD و فاصله برای پرش<br>موبایل: انگشتت رو روی سمت چپ بکش</p></div>

<script>
const MAXL=100,T=5,R=.6,GR=24,JV=9,$=id=>document.getElementById(id);
/* ===== موتور صدا: همه‌ی صداها زنده با Web Audio ساخته می‌شن (بدون فایل بیرونی) ===== */
const SFX=(()=>{
let ac,mst,sb,mb,rev,nW,nB,ready=0,on=true,mus=true,bl=0,blHz=1,blPh=0,lastTick=99,prevT=null,flFlag=0,gemT=0,gemN=0,mT=0,mStep=0,mLvl=1,mBoss=0,fa=0;const L={};
try{on=localStorage.getItem('sbm')!=='0';mus=localStorage.getItem('sbmu')!=='0'}catch(e){}
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),mf=m=>440*Math.pow(2,(m-69)/12),rr=Math.random,ok=()=>ready&&on&&ac.state==='running',now=()=>ac.currentTime,T=(p,v,k)=>p.setTargetAtTime(v,ac.currentTime,k||.08);
const sp3=(x,z,R)=>{const dx=x-B.x,dz=z-B.z,d=Math.hypot(dx,dz);return[Math.pow(cl(1-d/(R||26),0,1),1.4),cl((-dx*Math.cos(yaw)+dz*Math.sin(yaw))/10,-1,1)]};
const PR=[[0,3,7],[-4,0,3],[3,7,10],[-2,2,5]],RT=[57,55,52,50,53,59,48];
function ir(sec,dec){const n=ac.sampleRate*sec|0,b=ac.createBuffer(2,n,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(rr()*2-1)*Math.pow(1-i/n,dec)}return b}
function mkNoise(){const n=ac.sampleRate*2|0;nW=ac.createBuffer(1,n,ac.sampleRate);nB=ac.createBuffer(1,n,ac.sampleRate);const a=nW.getChannelData(0),b=nB.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=rr()*2-1;a[i]=w;l=(l+.02*w)/1.02;b[i]=l*3.5}}
/* خروجی: پن استریو (صدای فضایی) + ارسال به ریورب */
function out(n,o){let d=o.m?mb:sb;if(o.p&&ac.createStereoPanner){const pn=ac.createStereoPanner();pn.pan.value=o.p;pn.connect(d);d=pn}n.connect(d);if(o.rv){const g=ac.createGain();g.gain.value=o.rv;n.connect(g);g.connect(rev)}}
function tn(o){const t=o.t||now(),a=o.a||.004,os=ac.createOscillator(),g=ac.createGain();os.type=o.ty||'sine';os.frequency.setValueAtTime(o.f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+(o.fd||a+o.d));if(o.dt)os.detune.value=o.dt;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,o.v),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+o.d);
 let n=os;if(o.lp){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;os.connect(f);n=f}n.connect(g);out(g,o);
 if(o.vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=o.vib[0];lg.gain.value=o.vib[1];l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+a+o.d+.05)}
 os.start(t);os.stop(t+a+o.d+.05);return os}
function nz(o){const t=o.t||now(),a=o.a||.003,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=o.br?nB:nW;s.loop=true;f.type=o.ty||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+a+o.d);f.Q.value=o.q||1;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,o.v),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+o.d);s.connect(f);f.connect(g);out(g,o);s.start(t,rr()*1.5);s.stop(t+a+o.d+.05)}
function loopN(buf,type,f,q){const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=buf;s.loop=true;fl.type=type;fl.frequency.value=f;fl.Q.value=q;g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(sb);s.start();return{g:g.gain,f:fl.frequency}}
function duck(){const n=now();mb.gain.cancelScheduledValues(n);mb.gain.setTargetAtTime(mus?.12:0,n,.02);mb.gain.setTargetAtTime(mus?.5:0,n+.55,.3)}
function init(){
 if(ac){if(ac.state==='suspended')ac.resume();return}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 try{ac=new AC()}catch(e){ac=null;return}
 mst=ac.createGain();mst.gain.value=on?.9:0;
 const cp=ac.createDynamicsCompressor();cp.threshold.value=-16;cp.knee.value=12;cp.ratio.value=5;cp.attack.value=.004;cp.release.value=.22;mst.connect(cp);cp.connect(ac.destination);
 sb=ac.createGain();sb.connect(mst);mb=ac.createGain();mb.gain.value=mus?.5:0;mb.connect(mst);
 const dl=ac.createDelay(1),fb=ac.createGain(),lf=ac.createBiquadFilter();dl.delayTime.value=.5;fb.gain.value=.34;lf.type='lowpass';lf.frequency.value=2200;mb.connect(dl);dl.connect(lf);lf.connect(fb);fb.connect(dl);lf.connect(mst);
 rev=ac.createConvolver();rev.buffer=ir(2.2,2.4);const rg=ac.createGain();rg.gain.value=.35;rev.connect(rg);rg.connect(mst);
 mkNoise();
 L.rum=loopN(nB,'lowpass',200,.7);L.grit=loopN(nW,'bandpass',2500,.8);L.wind=loopN(nW,'bandpass',500,.6);L.bl=loopN(nW,'bandpass',900,2.2);
 {const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain(),lo=ac.createOscillator(),m=ac.createGain();o.type='sawtooth';o.frequency.value=46;f.type='lowpass';f.frequency.value=230;g.gain.value=0;lo.frequency.value=7.5;m.gain.value=0;o.connect(f);f.connect(g);g.connect(sb);lo.connect(m);m.connect(g.gain);o.start();lo.start();L.cv={g:g.gain,m:m.gain}}
 ready=1;setInterval(sched,100);
 const s=ac.createBufferSource();s.buffer=ac.createBuffer(1,1,22050);s.connect(ac.destination);s.start(0);
 if(ac.state==='suspended')ac.resume()}
/* ---- افکت‌ها ---- */
function seam(sp,ice){if(!ok())return;const k=cl(sp/10,0,1);nz({ty:'highpass',f:ice?5000:2200,d:.02,v:.012+.05*k});tn({f:ice?300:85,d:.05,v:.03+.07*k})}
function whistle(){if(!ok())return;tn({f:1300,f2:180,d:1.1,v:.06,vib:[5,25],rv:.2});nz({f:900,f2:200,q:1.5,d:1.1,v:.07})}
function ticker(c){if(!ok())return;tn({f:c<=3?1320:880,d:.07,v:.1,ty:'square',lp:3000})}
function gem(){if(!ok())return;const n=now();if(n-gemT>1.8)gemN=0;gemT=n;const sc=[0,2,4,7,9,12,14,16,19,21],f=mf(72+sc[Math.min(gemN++,9)]);
 [[1,.2,.9],[2.76,.09,.5],[5.4,.04,.25]].forEach(([r,v,d])=>tn({f:f*r,d,v,rv:.45}));tn({t:n+.07,f:f*2,d:.3,v:.05,ty:'triangle',rv:.4});nz({ty:'highpass',f:7000,d:.12,v:.05,rv:.5})}
function sched(){if(!ok()||!mus)return;const n=now();if(mT<n)mT=n+.05;while(mT<n+.5){musStep(mT,mStep++);mT+=60/(mBoss?132:84)/2}}
function musStep(t,s){const bt=60/(mBoss?132:84),ch=PR[(s>>3)&3],pos=s&7,root=RT[mLvl%7]+(mBoss?-5:0);
 if(pos===0)ch.forEach((n,i)=>[-7,9].forEach(dt=>tn({m:1,t,f:mf(root+n),a:.8,d:bt*3.4,v:.026,ty:i&1?'triangle':'sawtooth',lp:900,dt,rv:.5})));
 if(rr()<(mBoss?.9:.5))tn({m:1,t,f:mf(root+ch[(rr()*3)|0]+[12,12,19,24][(rr()*4)|0]),d:.5,v:.045,ty:'triangle',rv:.6,lp:2800});
 if(mBoss){if(!(s&1))tn({m:1,t,f:140,f2:42,fd:.12,d:.2,v:.5});if(s&1)nz({m:1,t,ty:'highpass',f:8000,d:.03,v:.07});tn({m:1,t,f:mf(root-24+(pos===3||pos===6?7:0)),d:bt*.45,v:.12,ty:'sawtooth',lp:500})}}
/* ---- رابط عمومی ---- */
const A={
unlock:init,
reset(n){lastTick=99;flFlag=0;prevT=null;mLvl=n;mBoss=n%10===0?1:0},
near(d,hz,k){const p=k*Math.pow(cl(1-d/15,0,1),2);if(p>bl){bl=p;blHz=hz}},
frame(dt,s){if(!ready)return;const t=s.t,gr=s.g&&t,sp=s.sp,ice=s.ice,k=gr?cl(sp/10,0,1.2):0;blPh+=dt*6.283*blHz;
 if(gr){if(prevT&&t!==prevT&&sp>1.5)seam(sp,ice);prevT=t}
 if(s.y<-1.2&&s.vy<-4){if(!flFlag){flFlag=1;whistle()}}else if(s.y>-.4)flFlag=0;
 if(s.tl<=10){const c=Math.ceil(s.tl);if(c!==lastTick){lastTick=c;ticker(c)}}
 fa+=dt;if(fa<.03)return;fa=0;
 T(L.rum.g,gr?Math.pow(k,1.1)*(ice?.2:.5):0,.07);T(L.rum.f,110+k*650,.07);
 T(L.grit.g,gr?Math.pow(k,1.7)*(ice?.13:.07):0,.07);T(L.grit.f,ice?5200:1600+k*1400,.1);
 const air=Math.hypot(sp,s.vy),aa=gr?0:Math.max(0,air-3),gu=s.wind?.05+.07*(.5+.5*Math.sin(s.tm*.8)):0;
 T(L.wind.g,Math.min(.5,.012+aa*.026+gu),.12);T(L.wind.f,Math.min(2600,320+air*55+(s.wind?250:0)),.12);
 const cv=gr&&t.c==='C';T(L.cv.g,cv?.05:0,.12);T(L.cv.m,cv?.03:0,.12);
 const ap=bl*(.2+.8*Math.pow(Math.abs(Math.sin(blPh)),2));T(L.bl.g,ap*.55,.04);T(L.bl.f,550+450*Math.abs(Math.sin(blPh)),.04);bl=0},
idle(dt){if(!ready)return;fa+=dt;if(fa<.05)return;fa=0;bl=0;[L.rum.g,L.grit.g,L.bl.g,L.cv.g,L.cv.m].forEach(p=>T(p,0,.1));T(L.wind.g,.01,.3)},
jump(lo){if(!ok())return;const f=lo?.7:1;tn({f:160*f,f2:380*f,d:.14,v:.15});nz({f:500,f2:1800,q:.9,d:.16,v:.09});nz({ty:'lowpass',f:300,br:1,d:.08,v:.35})},
boing(){if(!ok())return;const t=now(),o=tn({f:150,f2:640,fd:.09,d:.5,v:.26,vib:[26,35],rv:.3});o.frequency.exponentialRampToValueAtTime(260,t+.45);
 tn({f:300,f2:1280,fd:.09,d:.3,v:.06,ty:'triangle'});nz({f:900,q:1.2,d:.09,v:.18});tn({f:2300,d:.25,v:.03,rv:.4})},
land(iv,c){if(!ok())return;const i=cl((iv-2)/14,0,1),v=.12+i*.6,q=.3+i;
 tn({f:150+(1-i)*60,f2:48,d:.1+.18*i,v:v*.9});nz({ty:'lowpass',f:1400,f2:200,br:1,d:.08+.12*i,v:v*1.2});
 if(c==='I'||c==='P'){tn({f:2100+rr()*200,d:.35,v:.08*q,rv:.4});nz({ty:'highpass',f:4500,d:.08,v:.1*q})}
 else if(c==='D'){nz({f:520,q:5,d:.1,v:.3*q});tn({f:210,f2:120,d:.1,v:.12*q,ty:'triangle'})}
 else if(c==='C'||c==='O'){tn({f:880,d:.25,v:.06*q,ty:'triangle',rv:.3});nz({f:1300,q:8,d:.07,v:.15*q})}
 else{nz({f:2600,q:3,d:.03,v:.15*q});tn({f:1500+rr()*300,d:.2,v:.035*q,rv:.3})}
 if(iv>10)nz({ty:'lowpass',f:250,br:1,d:.35,v:.5})},
crumble(x,z){if(!ok())return;const[v,p]=sp3(x,z);nz({ty:'lowpass',f:500,br:1,d:.55,v:.45*v+.05,p});for(let i=0;i<5;i++)nz({t:now()+rr()*.45,f:900+rr()*1500,q:4,d:.03,v:(.12+rr()*.1)*(v+.2),p})},
drop(x,z){if(!ok())return;const[v,p]=sp3(x,z);if(v<.03)return;nz({ty:'lowpass',f:600,f2:120,br:1,d:.6,v:.4*v,p});tn({f:300,f2:60,d:.4,v:.1*v,p})},
phase(on_,x,z){if(!ok())return;const[v,p]=sp3(x,z,20);if(v<.05)return;tn({f:on_?740:520,f2:on_?880:390,d:.09,v:.05*v,ty:'triangle',p,rv:.3})},
spike(x,z){if(!ok())return;const[v,p]=sp3(x,z,20);if(v<.04)return;nz({ty:'highpass',f:3200,d:.07,v:.14*v,p});tn({f:1900,f2:700,d:.07,v:.07*v,ty:'triangle',p});nz({f:900,d:.05,v:.12*v,p})},
hurt(){if(!ok())return;tn({f:210,f2:42,d:.4,v:.7});nz({ty:'lowpass',f:2400,f2:180,d:.28,v:.55});nz({ty:'highpass',f:2000,d:.06,v:.3});tn({f:760,d:.7,v:.1,rv:.5});tn({f:1155,d:.5,v:.06,rv:.5});tn({f:420,f2:130,d:.2,v:.1,ty:'square',lp:1500});duck()},
lose(){if(!ok())return;const n=now();tn({f:110,f2:34,d:.7,v:.5});nz({ty:'lowpass',f:700,f2:80,br:1,d:.7,v:.7});[392,330,262].forEach((f,i)=>tn({t:n+.05+i*.17,f,d:.35,v:.09,ty:'triangle',rv:.5,lp:1800}));duck()},
