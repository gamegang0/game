  if(ch.kind==='sum')pz='<b>🎯 هدف: '+FA(ch.p.tg)+'</b><b>جمع: '+FA(ch.p.sum)+'</b>';else if(ch.kind==='pattern')pz='<b>'+ch.p.s.slice(0,4).map(FA).join(' ، ')+' ، ؟</b>';else if(ch.p.q)pz='<b>'+ch.p.q+'</b>';else if(ch.kind==='code'&&ch.hinted)pz='<b>🔢 کد: '+ch.p.digits.map(FA).join(' ')+'</b>';else if(ch.kind==='lights')pz=ch.p.lamps.map((v,i)=>'<i style="background:'+(v?'#2bff7a':'#ff3b3b')+'"></i>').join('');
  else if(ch.kind==='code')pz='<b>🔢 کد '+FA(ch.p.k)+' رقمی</b>';
  else if(ch.p.showT>0)pz='<b>'+ch.p.seq.map(i=>'<i style="background:'+CS[i]+'"></i>').join('')+(ch.hinted?' '+FA(ch.p.prog)+'/'+FA(ch.p.seq.length):'')+'</b>';
  else if(ch.shown)pz='<b>'+FA(ch.p.prog)+' / '+FA(ch.p.seq.length)+'</b>'}
 else pz='<b>✅ در باز است — به خروجی برو</b>';
 if(hc.hint!==h){hc.hint=h;$('hint').textContent=h}if(hc.pz!==pz){hc.pz=pz;$('pz').innerHTML=pz}
 $('ba').style.outline=h?'3px solid #ffe27a':'none';$('bd').style.opacity=dashCd>0?.4:1}
/* ---------- پیشرفت و صفحه‌ها ---------- */
let prog=[];try{prog=JSON.parse(localStorage.getItem('lh_prog')||'[]')}catch(e){}if(!Array.isArray(prog))prog=[];
const ov=$('ov'),show=h=>{ov.innerHTML=h;ov.style.display='flex'},hideOv=()=>{ov.style.display='none'};
function ui(on){$('top').style.display=on?'flex':'none';$('btns').style.display=on?'flex':'none';if(!on){$('pz').innerHTML='';$('hint').textContent='';$('task').style.opacity=0;hc={}}}
function help(back){const h='<h2>📖 راهنما</h2><p style="text-align:right">🎯 <b>هدف:</b> از اتاق‌ها رد شو، معما را حل کن تا در امنیتی باز شود و به خروجی سبز برس، قبل از تمام شدن زمان.<br>🎮 <b>کنترل:</b> حرکت با WASD/فلش‌ها یا کشیدن روی صفحه · پرش با فاصله · عمل با E · راهنما با H.<br>🔴 <b>لیزر قرمز:</b> چشمک می‌زند؛ وقتی خاموش بود رد شو. <b>نارنجی:</b> رفت‌وبرگشتی. <b>صورتی:</b> چرخان.<br>⚠️ <b>خارها:</b> وقتی بالا می‌آیند بپر. <b>پهپاد:</b> از دایره‌ی قرمزش دور بمان.<br>🔢 <b>کد:</b> عبارت ستون‌ها را حساب کن و در پایانه‌ی کنار در بزن.<br>💡 <b>چراغ‌ها:</b> هر کلید چراغ‌های نوشته‌شده را برعکس می‌کند؛ همه باید سبز شوند.<br>🎯 <b>ترتیب:</b> ترتیب رنگ‌ها را از پایانه ببین و به همان ترتیب روی پایه‌ها برو.<br>🧮 <b>جمع:</b> گوی‌های عددی را بردار تا جمعشان برابر هدف شود؛ بیشتر شد همه برمی‌گردند.<br>🧩 <b>الگو:</b> عدد بعدی دنباله را پیدا کن و روی پایه‌ی درستش بایست.<br>📚 <b>هر مرحله ۲ تا ۴ اتاق با معماهای متفاوت دارد:</b> کد، چراغ، ترتیب، جمع، الگو، محاسبه، عدد متفاوت، رنگ.<br>🟢 <b>موج پالس:</b> وقتی حلقه‌ی سبز رسید بپر.<br>🟡 <b>تیغه‌ی لغزنده:</b> زمان‌بندی کن و رد شو.<br>🛡 سپر · ⏱ ۸ ثانیه زمان · ⚡ سرعت · 💨 دش (Shift یا Q)<br>⚠ برخورد = ۴ ثانیه جریمه و برگشت به اول اتاق.<br>🪙 <b>سکه:</b> اولین بار که هر مرحله را تمام کنی ۱ سکه می‌گیری. دکمه‌ی 💡 جواب معمای همان اتاق را می‌دهد و ۷ سکه خرج دارد (برای هر اتاق فقط یک بار).<br>⭐ ستاره: بدون برخورد و با زمان زیاد = ۳ ستاره.</p><button id="hb">بازگشت</button>';show(h);$('hb').onclick=back}
function gfxUI(){return '<div style="font-size:14px;margin-top:4px">گرافیک:<br>'+[['low','پایین'],['med','متوسط'],['high','بالا'],['pro','حرفه‌ای']].map(a=>'<button class="gq" data-q="'+a[0]+'">'+a[1]+'</button>').join('')+'</div><div><button class="gq" id="fsb"></button></div><p id="gh" style="font-size:12px;opacity:.75"></p>'}
function markGfx(){ov.querySelectorAll('.gq').forEach(b=>b.style.outline=b.dataset.q===gfx?'3px solid #fff':'none');const g=$('gh');if(g)g.textContent=GQ[gfx].txt;const f=$('fsb');if(f)f.textContent='🖵 تمام‌صفحه: '+(fsOn?'روشن':'خاموش')}
function bindGfx(){ov.querySelectorAll('.gq').forEach(b=>b.onclick=()=>{gfx=b.dataset.q;try{localStorage.setItem('lh_gfx',gfx)}catch(e){}applyGfx();markGfx()});const f=$('fsb');if(f)f.onclick=()=>{fsOn=!fsOn;try{localStorage.setItem('lh_fs',fsOn?'1':'0')}catch(e){}if(fsOn)goFS();else exitFS();markGfx()};markGfx()}
function menu(){st='menu';ui(false);build(1);show('<h1>🔴 نفوذگر لیزری</h1><p>از اتاق‌های پر از لیزر و تله رد شو، معما را حل کن، در امنیتی را باز کن و فرار کن — قبل از اینکه زمان تمام شود!<br>۱۰۰ مرحله · هر مرحله یک معمای فکری زماندار</p><p style="font-size:13px;opacity:.7">حرکت: WASD یا کشیدن روی صفحه · پرش: فاصله · عمل: E</p><button id="b0">▶ شروع بازی</button><button id="b1" class="g">ماموریت‌ها</button><button id="b4" class="g">📖 راهنما</button><p>🪙 '+FA(coins)+'</p>'+gfxUI());bindGfx();$('b0').onclick=()=>{au();let q=1;while(q<100&&prog[q-1]>0)q++;start(q)};$('b1').onclick=()=>{au();levels()};$('b4').onclick=()=>help(menu)}
function levels(){let h='<h2>انتخاب مرحله</h2><div id="lv">';for(let i=1;i<=100;i++){const un=i===1||prog[i-2]>0,s=prog[i-1]||0;h+='<button data-n="'+i+'"'+(un?'':' disabled')+'>'+(un?FA(i):'🔒')+'<small>'+(un?'★'.repeat(s)+'☆'.repeat(3-s):'&nbsp;')+'</small></button>'}h+='</div><p>🪙 '+FA(coins)+'</p><button id="bb" class="g">بازگشت</button>';show(h);
 ov.querySelectorAll('#lv button').forEach(b=>b.onclick=()=>{au();start(+b.dataset.n)});$('bb').onclick=menu}
function start(n){goFS();build(n);st='play';paused=false;hideOv();ui(true);$('hl').textContent='مرحله '+FA(n);hc={};cam.position.set(0,15,10);note('مرحله '+FA(n)+' · '+TASK[L.ch[0].kind]);L.ch[0]&&(cur=0);NA('start',0);NA('score',total)}
function pause(on){if(st!=='play')return;paused=on;if(on){show('<h2>⏸ توقف</h2><button id="b1">ادامه</button><button id="b2" class="g">ماموریت‌ها</button><button id="b4" class="g">📖 راهنما</button>'+gfxUI());bindGfx();$('b1').onclick=()=>pause(false);$('b2').onclick=()=>{paused=false;levels()};$('b4').onclick=()=>help(()=>pause(true))}else hideOv()}
$('pb').onclick=()=>pause(true);
function finish(win){st='end';ui(false);kpClose();const n=L.n;let gain=0;
 if(win){const r=timeLeft/L.limit,s=hits===0&&r>.3?3:hits<=3&&r>.1?2:1;if(!prog[n-1]){gain=1;coins++;saveCoins()}if(s>(prog[n-1]||0))prog[n-1]=s;try{localStorage.setItem('lh_prog',JSON.stringify(prog))}catch(e){}sfx.win();
  total+=10000;try{localStorage.setItem('lh_score',total)}catch(e){}NA('score',total);NA('finish',total,{won:true});
  show('<h2>✅ مرحله '+FA(n)+' تمام شد!</h2><div style="font-size:40px;color:#ffd23f">'+'★'.repeat(s)+'☆'.repeat(3-s)+'</div><p>زمان باقی‌مانده: '+FA(Math.ceil(timeLeft))+' ثانیه · برخورد: '+FA(hits)+'<br>🎯 +۱۰۰۰۰ امتیاز (جمع: '+FA(total)+')'+(gain?'<br>🪙 +۱ سکه (جمع: '+FA(coins)+')':'')+'</p>'+(n<100?'<button id="b1">مرحله بعد</button>':'<p>🏆 همه‌ی مراحل را تمام کردی!</p>')+'<button id="b2" class="g">تکرار</button><button id="b3" class="g">ماموریت‌ها</button>');
  if(n<100)$('b1').onclick=()=>start(n+1);$('b2').onclick=()=>start(n);$('b3').onclick=levels}
 else{sfx.lose();NA('finish',total,{won:false});show('<h2>⏰ زمان تمام شد!</h2><p>نگهبان‌ها رسیدند. دوباره امتحان کن.</p><button id="b2">تکرار</button><button id="b3" class="g">ماموریت‌ها</button>');$('b2').onclick=()=>start(n);$('b3').onclick=levels}}
/* ---------- حلقه ---------- */
let last=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;
 if(st==='play'&&!paused){update(dt);
  const tx=PP.x*.6;cam.position.x+=(tx-cam.position.x)*Math.min(1,dt*6);cam.position.z+=(PP.z+11.5-cam.position.z)*Math.min(1,dt*6);cam.position.y=15;
  if(shake>0){shake-=dt;cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake}
  cam.lookAt(cam.position.x*.8,0,cam.position.z-12)}
 else if(st==='menu'||st==='end'||paused){L.ht+=dt;tt+=dt;for(const hz of L.haz)hz.upd(L.ht);const a=t/4000;cam.position.set(Math.sin(a)*9,9,-12+Math.cos(a)*14);cam.lookAt(0,0,-14);P.visible=true;P.position.set(0,0,-8);P.rotation.y=a}
 {const act=st==='play'&&!paused;gfxFrame(act?PP.x:0,act?PP.z:-8,dt)}
 for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.l-=dt;p.vy-=14*dt;p.o.position.x+=p.vx*dt;p.o.position.y=Math.max(.05,p.o.position.y+p.vy*dt);p.o.position.z+=p.vz*dt;if(p.l<=0){S.remove(p.o);PT.splice(i,1)}}
 R.render(S,cam)}
applyGfx();menu();requestAnimationFrame(loop);
})();
