function ownedBy(e){const r=[];for(let i=1;i<=N;i++)if(S.own[i]===e)r.push(i);return r}
function unitPow(k,mode){const d=UD[k];return (mode==='a'?d.a:d.d)*(1+0.08*(S.up[k]||0))}
function playerRegPower(id){let p=0;const u=S.reg[id].u;for(const k in u)p+=u[k]*unitPow(k,'d');return p*defMulOf(id)}

const neutralGar=id=>6+Math.sqrt(R[id].a)*1.25;

function newGame(opts){
 const own=new Array(N+1).fill(0);const reg=[null];
 for(let i=1;i<=N;i++)reg.push({b:[],u:{},g:own[i]?0:neutralGar(i),q:[]});
 const emp=[null,{id:1,name:opts.empName,color:EMPCOL[0],cap:opts.start,ai:false}];
 own[opts.start]=1;
 reg[opts.start].b=[{t:'command',l:1},{t:'house',l:1},{t:'farm',l:1}];reg[opts.start].u={inf:6};reg[opts.start].g=0;
 // AI starts
 const used=new Set([opts.start]);const bad=new Set([opts.start,...R[opts.start].n]);
 const cand=R.filter(r=>r&&r.a>=220&&r.a<=2600&&!bad.has(r.id));
 for(let k=0;k<opts.rivals;k++){
  let pick=null,best=-1;
  for(let tr=0;tr<60;tr++){const c=cand[Math.floor(Math.random()*cand.length)];if(used.has(c.id)||R[c.id].n.some(n=>used.has(n)))continue;
    let md=1e9;used.forEach(u=>{md=Math.min(md,Math.hypot(R[u].x-c.x,R[u].y-c.y))});if(md>best){best=md;pick=c.id}}
  if(pick==null)break;used.add(pick);
  const id=emp.length;emp.push({id,name:lang==='fa'?AINAMES_FA[k%19]:AINAMES[k%19],color:EMPCOL[(k+1)%20],cap:pick,ai:true,alive:true,aggr:0.4+Math.random()*0.6,lvl:1,peace:0,ally:false,rel:Math.floor(Math.random()*40)-10,cd:30+Math.random()*60,gift:0});
  own[pick]=id;reg[pick].g=28;
 }
 S={ver:1,user:user,t:0,lvl:1,xp:0,res:{m:900,f:300,i:150,o:80,t:0},own,reg,emp,up:{},mis:{},st:{trained:0,built:0,captured:0,units:0,peace:0},
    mk:{f:2,i:3,o:4,t:12},offers:[],log:[],chat:[],won:false,dead:false,speed:1,wx:'clear',wxT:0,nextOffer:80,aiLvlT:0};
 S.chat.push({n:'⚙️',m:lang==='fa'?'به EMPIRE WAR خوش آمدی!':'Welcome to EMPIRE WAR!'});
 view.fit=true;
}

 if(!soundOn)return;try{

 const tone=(f,d,ty='sine',v=.12,s=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,n+s);g.gain.exponentialRampToValueAtTime(.001,n+s+d);o.connect(g).connect(AC.destination);o.start(n+s);o.stop(n+s+d)};
 if(type==='click')tone(520,.07,'triangle',.08);

 else if(type==='boom'){const b=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.2);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=.35;s.connect(g).connect(AC.destination);s.start(n)}
 else if(type==='alert'){tone(880,.12,'sawtooth',.08);tone(660,.2,'sawtooth',.08,.13)}

/* ================= Helpers: UI messages ================= */
function toast(m,c){const d=document.createElement('div');d.className='t '+(c||'');d.textContent=m;$('toast').appendChild(d);setTimeout(()=>d.remove(),3800)}
function logm(m,c){S.log.unshift({t:S.t,m});if(S.log.length>60)S.log.pop();toast(m,c)}
function canPay(c,mul=1){for(const k in c)if(S.res[k]<c[k]*mul)return false;return true}
function pay(c,mul=1){for(const k in c)S.res[k]-=c[k]*mul}
function costTxt(c,mul=1){return Object.keys(c).map(k=>RESI[k]+fmt(c[k]*mul)).join(' ')}
function addXP(x){S.xp+=x;let up=false;while(S.lvl<MAXL&&S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;up=true;
  const m=S.lvl%5;if(m===3)S.res.t+=10+S.lvl;else if(m===4)S.res.m+=300+S.lvl*40;
  const un=(unlockAt[S.lvl]||[]).map(u=>u.k==='b'?nameOf(BD[u.id]):nameOf(UD[u.id])).join('، ');
  logm((lang==='fa'?'سطح ':'Level ')+S.lvl+(un?' — '+t('unlocks')+': '+un:' — '+t('perk')+': '+perkText(S.lvl)[lang==='fa'?0:1]),'ok')}
 if(up)snd('lvl');if(S.lvl>=MAXL)S.xp=0}

/* ================= Economy / buildings ================= */
function bCost(type,lvl){const d=BD[type];const f=Math.pow(1.55,lvl-1)*costMul(S.lvl);const c={};for(const k in d.c)c[k]=Math.ceil(d.c[k]*f);return c}
function buildHere(id,type){
 const r=S.reg[id],d=BD[type];
 if(S.own[id]!==1)return toast(t('notown'),'bad');
 if(S.lvl<d.L)return toast(t('need')+' '+d.L,'bad');
 if(d.max&&hasB(id,type))return;
 if(d.coast&&!R[id].c)return toast(lang==='fa'?'این منطقه ساحلی نیست':'Not coastal','bad');
 if(r.b.length>=slotsOf(id))return toast(lang==='fa'?'اسلات خالی نیست':'No free slot','bad');
 const c=bCost(type,1);if(!canPay(c))return toast(t('nores'),'bad');
 pay(c);r.b.push({t:type,l:1});S.st.built++;addXP(6+d.L);snd('build');fx.push({k:'ring',x:R[id].x,y:R[id].y,t:0});renderUI();saveGame()
}
function upgradeB(id,idx){
 const b=S.reg[id].b[idx];if(!b||b.l>=10)return;const c=bCost(b.t,b.l+1);
 if(!canPay(c))return toast(t('nores'),'bad');pay(c);b.l++;addXP(4+b.l*2);snd('build');renderUI();saveGame()
}
function regionIncome(id){
 const out={m:0,f:0,i:0,o:0,t:0};const nr=natRes(id);const pw=hasB(id,'power')?1.2:1;
 for(const b of S.reg[id].b){const d=BD[b.t];const g=1+0.4*(b.l-1);
  for(const k in d.p){let v=d.p[k]*g*pw*prodMul(S.lvl);
   if(d.bon==='farm'&&nr==='farm')v*=1.6;if(d.bon==='iron'&&nr==='iron')v*=1.8;if(d.bon==='oil'&&nr==='oil')v*=1.8;if(d.bon==='gold'&&nr==='gold')v*=1.4;
   out[k]+=v}}
 if(S.own[id]===1)out.m+=0.4+Math.sqrt(R[id].a)*0.03+(CAP[R[id].en]?1.5:0);
 return out
}
function totalIncome(){const o={m:0,f:0,i:0,o:0,t:0};for(let i=1;i<=N;i++)if(S.own[i]===1){const r=regionIncome(i);for(const k in o)o[k]+=r[k]}
 let un=0;for(let i=1;i<=N;i++)if(S.own[i]===1)for(const k in S.reg[i].u)un+=S.reg[i].u[k];
 o.f-=un*0.08;o.m-=un*0.05;return o}
function trainHere(id,u,n){
 const d=UD[u],r=S.reg[id];
 if(S.own[id]!==1)return;if(S.lvl<d.L)return toast(t('need')+' '+d.L,'bad');
 if(!hasB(id,d.nb))return toast((lang==='fa'?'نیاز به ':'Needs ')+nameOf(BD[d.nb]),'bad');
 const queued=r.q.filter(q=>UD[q.u].dom===d.dom).reduce((s,q)=>s+q.n,0);
 if(popUnits(id,d.dom)+queued+n>capOf(id,d.dom))return toast(t('cap')+'!','bad');
 const c={};for(const k in d.c)c[k]=Math.ceil(d.c[k]*(1+0.01*(S.up[u]||0)));
 if(!canPay(c,n))return toast(t('nores'),'bad');
 pay(c,n);r.q.push({u,n,at:S.t+3+n*0.5+d.L*0.15});S.st.trained+=n;addXP(n*(1+d.L*0.3));snd('click');renderUI();saveGame()
}

/* ================= Combat ================= */
function rollBattle(A0,D0){
 const rounds=[];let A=A0,D=D0;
 for(let i=0;i<8&&A>A0*0.03&&D>D0*0.03;i++){
  const rnd=()=>0.85+Math.random()*0.3;
  const la=Math.min(0.5,0.2*(D/Math.max(A,1))*rnd()),ld=Math.min(0.5,0.2*(A/Math.max(D,1))*rnd());
  A*=1-la;D*=1-ld;rounds.push({A,D})}
 return {win:A>D,A,D,rounds,af:A/A0,df:D/D0}
}
function linkOK(from,to,u){
 const d=UD[u].dom,r=R[from];
 if(d==='land'){return r.t.includes(to)||(r.n.includes(to)&&(hasB(from,'port')||hasB(from,'airport')))}
 if(d==='air'){return r.n.includes(to)||r.n.some(x=>R[x].n.includes(to))}
 return r.n.includes(to)&&r.c&&R[to].c
}
function sendForce(from,to,force){
 const tot=Object.values(force).reduce((a,b)=>a+b,0);if(!tot)return toast(t('nounits'),'bad');
 const src=S.reg[from];
 for(const k in force){if(!linkOK(from,to,k))return toast(t('nolink'),'bad');src.u[k]=(src.u[k]||0)-force[k];if(src.u[k]<=0)delete src.u[k]}
 if(S.own[to]===1){ // move
  const d=S.reg[to];for(const k in force)d.u[k]=(d.u[k]||0)+force[k];toast(t('move')+' ✓','ok');snd('click');renderUI();saveGame();return}
 const ow=S.own[to];
 if(S.lvl<regReqLvl(to)){for(const k in force)src.u[k]=(src.u[k]||0)+force[k];return toast(t('locks')+' ('+regReqLvl(to)+')','bad')}
 if(ow>1){const e=S.emp[ow];if(e.peace>S.t||e.ally){e.peace=0;e.ally=false;e.rel-=40;logm((lang==='fa'?'پیمان صلح با ':'Peace broken with ')+e.name,'bad')}}
 let A0=0,hasLand=false;for(const k in force){A0+=force[k]*unitPow(k,'a');if(UD[k].dom==='land')hasLand=true}
 A0*=atkMul(S.lvl);
 let D0=S.reg[to].g||neutralGar(to);
 // defence systems/radars reduce air power
 if(S.own[to]===0||ow>1){const air=Object.keys(force).filter(k=>UD[k].dom==='air').reduce((s,k)=>s+force[k]*unitPow(k,'a'),0);
   if(air>0&&(S.reg[to].dm||0)>0)A0-=air*Math.min(0.4,S.reg[to].dm)*atkMul(S.lvl)}
 const res=rollBattle(A0,D0);

 if(!al.length)return h+'—';
 h+=al.map(e=>{const st=e.ally?t('allied'):e.peace>S.t?t('atpeace'):t('atwar');return `<div class="card"><div class="row"><b style="color:${e.color}">● ${e.name}</b><span class="tag">${st}</span></div><div class="sm">${t('regions')}: ${ownedBy(e.id).length} · ${t('power')}: ${fmt(empPower(e.id))} · ${t('relation')}: ${e.rel}</div><div class="row">`+
  (e.ally?`<button class="bad" onclick="declareWar(${e.id})">${t('war')}</button>`:e.peace>S.t?`<button onclick="propose(${e.id},'ally')">${t('propally')}</button><button class="bad" onclick="declareWar(${e.id})">${t('war')}</button>`:`<button class="pri" onclick="propose(${e.id},'peace')">${t('propose')}</button>`)+`<button onclick="giftEmp(${e.id})">${t('gift')}</button></div></div>`}).join('');
 return h}
function marketPanel(){
 let h=`<h3>⚖️ ${t('market')}</h3>`+['f','i','o','t'].map(k=>`<div class="card"><div class="row"><span>${RESI[k]} ${t(RESN[k])} <span class="sm">(${fmt(S.res[k])})</span></span><b>${S.mk[k].toFixed(1)} 💰</b></div><div class="row"><button onclick="mkBuy('${k}')">${t('buy')} ×10 (${fmt(S.mk[k]*11)})</button><button onclick="mkSell('${k}')">${t('sell')} ×10 (${fmt(S.mk[k]*9)})</button></div></div>`).join('');
 h+=`<h4>${t('offers')}</h4>`+(S.offers.length?S.offers.map((o,i)=>`<div class="card"><div class="row"><span>${S.emp[o.e].name}: ${RESI[o.give]} ${o.amt} ⇄ 💰 ${fmt(o.ask)}</span></div><div class="row"><button class="pri" onclick="acceptOffer(${i})">${t('accept')}</button><button onclick="declineOffer(${i})">${t('decline')}</button></div></div>`).join(''):'<div class="sm">—</div>');
 return h}
function morePanel(){
 if(sub==='chat'){return `<div class="row"><h3>💬 ${t('chat')}</h3><button onclick="sub='';renderUI()">←</button></div><div style="max-height:30vh;overflow:auto">`+S.chat.slice(-25).map(c=>`<div class="sm"><b style="color:${c.me?'var(--ac)':'var(--ac2)'}">${c.n}:</b> ${c.m.replace(/</g,'&lt;')}</div>`).join('')+`</div><div class="row"><input id="cin" placeholder="${t('say')}" style="flex:1" onkeydown="if(event.key==='Enter')chatSend()"><button class="pri" onclick="chatSend()">${t('sendmsg')}</button></div><div class="sm">${t('onlineNote')}</div>`}
 return `<h3>⚙️ ${t('settings')}</h3>
 <div class="grid"><button onclick="sub='chat';renderUI()">💬 ${t('chat')}</button><button onclick="saveGame();toast(t('saved'),'ok')">💾 ${t('save')}</button>
 <button onclick="soundOn=!soundOn;localStorage.setItem('ew_snd',soundOn?1:0);renderUI()">${soundOn?'🔊':'🔇'} ${t('sound')}</button><button onclick="setLang()">🌐 ${t('lng')}</button></div>
 <h4>${t('quality')}</h4><div class="grid" style="grid-template-columns:1fr 1fr 1fr">${['low','mid','high'].map(q=>`<button class="${quality===q?'pri':''}" onclick="quality='${q}';localStorage.setItem('ew_q','${q}');renderUI()">${t(q)}</button>`).join('')}</div>
 <h4>${t('speed')}</h4><div class="grid" style="grid-template-columns:1fr 1fr 1fr">${[1,2,4].map(s=>`<button class="${S.speed===s?'pri':''}" onclick="S.speed=${s};renderUI()">×${s}</button>`).join('')}</div>
 <div class="grid" style="margin-top:10px"><button onclick="saveGame();location.reload()">🚪 ${t('logout')}</button><button class="bad" onclick="if(confirm('?')){localStorage.removeItem('ew_save_'+user);location.reload()}">🔄 ${t('reset')}</button></div>
 <p class="sm">${t('onlineNote')}</p>`}
function setLang(){lang=lang==='fa'?'en':'fa';localStorage.setItem('ew_lang',lang);applyDir();renderUI()}
function applyDir(){document.body.dir=lang==='fa'?'rtl':'ltr';document.documentElement.lang=lang}
function renderUI(){
 if(!S)return;renderTop();renderNav();
 if(!sheetOpen)return;
 const el=$('sheet');const sc=el.scrollTop;
 el.innerHTML=({region:regionPanel,empire:empirePanel,dip:dipPanel,market:marketPanel,more:morePanel}[tab]||regionPanel)();
 el.scrollTop=sc}

/* ================= Start / login ================= */
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function startScreen(){
 applyDir();
 $('modal').innerHTML=`<div class="modal" id="start"><div class="box" style="background:#0b1530dd"><div class="logo">EMPIRE WAR</div><p class="sm" style="text-align:center">${lang==='fa'?'بازی استراتژیک جهانی':'Global strategy game'}</p>
 <h4>${t('login')}</h4><input id="lu" placeholder="${t('user')}" autocomplete="username"><div style="height:7px"></div><input id="lp" type="password" placeholder="${t('pass')}" autocomplete="current-password">
 <div class="row"><button class="pri" style="flex:1" onclick="doLogin()">${t('enter')}</button><button style="flex:1" onclick="doRegister()">${t('reg')}</button></div>
 <div class="row"><button onclick="setLang();startScreen()">🌐 ${t('lng')}</button></div><p class="sm">${t('startnote')}</p></div></div>`}
async function doLogin(){const u=$('lu').value.trim(),p=$('lp').value;const a=localStorage.getItem('ew_acc_'+u);if(!a)return toast(t('badlogin'),'bad');
 const {salt,hash:h}=JSON.parse(a);if(await sha(salt+p)!==h)return toast(t('badlogin'),'bad');user=u;afterLogin()}
async function doRegister(){const u=$('lu').value.trim(),p=$('lp').value;if(u.length<3||p.length<4)return toast(t('short'),'bad');if(localStorage.getItem('ew_acc_'+u))return toast(t('exists'),'bad');
 const salt=Math.random().toString(36).slice(2);localStorage.setItem('ew_acc_'+u,JSON.stringify({salt,hash:await sha(salt+p)}));user=u;afterLogin()}
function afterLogin(){
 const has=!!localStorage.getItem('ew_save_'+user);
 $('modal').innerHTML=`<div class="modal" id="start"><div class="box" style="background:#0b1530dd"><div class="logo">EMPIRE WAR</div><p style="text-align:center">👤 ${user}</p>
 ${has?`<button class="pri" style="width:100%;margin:6px 0" onclick="continueGame()">▶ ${t('cont')}</button>`:''}
 <h4>${t('newgame')}</h4><div class="sm">${t('empname')}</div><input id="en" value="${user}"><div class="sm" style="margin-top:8px">${t('rivals')}: <b id="rv">9</b> <span class="sm">(${lang==='fa'?'جمع بازیکنان ≤ ۲۰':'total ≤ 20'})</span></div><input type="range" id="rvr" min="2" max="19" value="9" oninput="$('rv').textContent=this.value" style="padding:0">
 <button class="pri" style="width:100%;margin-top:10px" onclick="beginPick()">🗺️ ${t('pickstart')}</button></div></div>`}
function continueGame(){if(!loadGame())return;closeModal();enterGame()}
function beginPick(){
 const name=$('en').value.trim()||user,rivals=+$('rvr').value;closeModal();
 // temp state for painting
 const tmp={own:new Array(N+1).fill(0),emp:[null]};S={own:tmp.own,emp:tmp.emp,reg:null,t:0,lvl:1,res:{},wx:'clear',speed:1};
 paintAll();selId=0;
 const cand=R.filter(r=>r&&r.a>=220&&r.a<=2600&&!r.t.every(()=>false));
 validTargets=new Set(cand.map(r=>r.id));paintAll();
 toast(t('pickstart'));
 window._pick={name,rivals};pickMode=true;view.fit=true;resize();
}
let pickMode=false;
const _otr=onTapRegion;
onTapRegion=function(id){
 if(pickMode){
  if(!id||!validTargets.has(id)){toast(lang==='fa'?'یک کشور کوچک انتخاب کن (قاب زرد)':'Pick a small (yellow) country','bad');return}
  modal(`<h3>${rn(id)}</h3><p class="sm">${t('area')}: ${fmt(R[id].a)} · ${cityName(id)}</p><div class="row"><button onclick="closeModal()">${t('cancel')}</button><button class="pri" onclick="confirmStart(${id})">OK</button></div>`);return}
 _otr(id)};
function confirmStart(id){pickMode=false;validTargets=new Set();closeModal();newGame({empName:_pick.name,start:id,rivals:_pick.rivals});enterGame()}
function enterGame(){
 applyDir();paintAll();recomputeDm();
 const c=S.emp[1].cap;view.z=Math.min(cv.width/W,cv.height/H)*3.2;view.x=cv.width/2-R[c].x*view.z;view.y=cv.height/2-R[c].y*view.z;clampView();
 selId=0;tab='region';openSheet(false);renderUI();saveGame();
 lastT=performance.now();setInterval(()=>{const now=performance.now();acc+=(now-lastT)*S.speed;lastT=now;while(acc>=1000){acc-=1000;if(!S.dead)tick()}renderTop();if(sheetOpen&&(tab==='region'||tab==='empire'||tab==='market'||tab==='dip')&&!curBattle&&!$('modal').innerHTML&&document.activeElement.tagName!=='INPUT')renderUI()},500)
}
/* boot */
resize();requestAnimationFrame(draw);
S=null;
(function boot(){
 const tmp={own:new Array(N+1).fill(0),emp:[null]};
 S={own:tmp.own,emp:tmp.emp,reg:null,t:0,lvl:1,res:{},wx:'clear',speed:1};paintAll();
 startScreen();
})();
addEventListener('beforeunload',()=>{if(S&&S.reg)saveGame()});
</script>
</body>
