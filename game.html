<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script><title>بازی سکه</title>
<style>
:root{--bg:#0f1219;--c:#1a1f2e;--c2:#232a3d;--t:#eef1f7;--m:#8b93a7;--a:#f5b942;--a2:#e08f14;--r:#e5484d;--g:#3dd68c}
@media(prefers-color-scheme:light){:root{--bg:#f1f2f7;--c:#fff;--c2:#eceef5;--t:#161a24;--m:#667;--a:#e0a020;--a2:#c98a0a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font-family:Tahoma,system-ui,sans-serif;padding:12px 12px calc(86px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
button{border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;background:var(--a);color:#111;cursor:pointer;transition:transform .12s,filter .2s;position:relative}
button:active:not(:disabled){transform:scale(.93)}button:disabled{opacity:.4;filter:grayscale(.7)}
.g{background:var(--c2);color:var(--t)}.red{background:var(--r);color:#fff}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #8b93a744;background:var(--bg);color:var(--t);font:inherit;margin:8px 0}
.c{background:var(--c);border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid #ffffff0d;animation:up .45s both}
.m{color:var(--m);font-size:13px}.row{display:flex;gap:8px}
@keyframes up{from{opacity:0;transform:perspective(700px) translateY(18px) rotateX(-22deg) translateZ(-30px)}to{opacity:1;transform:none}}
@keyframes pop{40%{transform:scale(1.3)}}@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fl{50%{transform:translateY(-10px) rotate(10deg)}}@keyframes rise{to{transform:translateY(-115vh) rotate(300deg)}}
@keyframes fly{to{transform:translate(var(--x),-170px) rotate(360deg);opacity:0}}
@keyframes slide{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes shake{20%{transform:rotate(-30deg)}40%{transform:rotate(25deg)}60%{transform:rotate(-20deg)}80%{transform:rotate(10deg)}}
@keyframes spin{to{transform:rotate(720deg) scale(1.3)}}@keyframes bnc{30%{transform:translateY(-14px)}60%{transform:none}80%{transform:translateY(-5px)}}
#bgc{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
#bgc span{position:absolute;bottom:-40px;font-size:26px;opacity:.06;animation:rise linear infinite}
.pg{display:none}.pg.on{display:block;animation:slide .35s both}
#toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:90;background:var(--c2);border:1px solid var(--a);border-radius:14px;padding:12px;text-align:center;font-weight:700;box-shadow:0 8px 24px #0006;transform:translateY(-160%);transition:transform .35s cubic-bezier(.2,1.2,.4,1)}#toast.on{transform:none}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c),var(--c2))}
.hero::after{content:"🪙";position:absolute;left:-8px;bottom:-24px;font-size:96px;opacity:.07;animation:fl 6s ease-in-out infinite}
.av{position:absolute;left:14px;top:14px;width:48px;height:48px;border-radius:50%;background:var(--a);color:#111;font-weight:800;font-size:21px;display:flex;align-items:center;justify-content:center;animation:pop .8s .3s both}
#co{font-size:34px;font-weight:800;color:var(--a);display:inline-block}#co.pop{animation:pop .5s}
.bar{height:9px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),#ffd982);transition:width .9s cubic-bezier(.2,.9,.3,1)}
.pills{display:flex;gap:8px;margin-top:10px}.pill{background:var(--bg);border-radius:20px;padding:5px 12px;font-size:13px}
.tiles{display:flex;gap:8px;margin-bottom:12px}
.tile{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 4px;border-radius:18px;background:linear-gradient(160deg,var(--a),var(--a2));box-shadow:0 4px 0 #0004;animation:up .5s both}
.tile:nth-child(2){animation-delay:.08s}.tile:nth-child(3){animation-delay:.16s}.ic{font-size:30px;display:inline-block}
#bm.do .ic{animation:shake .6s}#bw.do .ic{animation:spin 1s}#bd.do .ic{animation:bnc .7s}
.tile .t{font-size:12px;font-weight:600;opacity:.8}
button.busy{color:transparent!important}button.busy .ic,button.busy .t{opacity:0}button.busy::after{content:"";position:absolute;inset:0;margin:auto;width:20px;height:20px;border:3px solid #1114;border-top-color:#111;border-radius:50%;animation:sp .7s linear infinite}
.li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #ffffff0d;animation:up .4s both}.li.me{background:#f5b94218;border-radius:10px;padding-inline:8px;color:var(--a);font-weight:700}
.li button{padding:7px 13px;flex:none}
.acc{display:flex;gap:6px;margin-top:8px}.acc code{flex:1;background:var(--bg);border-radius:12px;padding:10px;direction:ltr;text-align:center;user-select:all;-webkit-user-select:all;letter-spacing:1px}.acc button{flex:none;padding:10px 14px}
.coin{position:fixed;font-size:22px;z-index:95;pointer-events:none;animation:fly 1.1s ease-out forwards}
#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid #ffffff10;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:80}
#tabs button{flex:1;background:none;color:var(--m);padding:6px 0;font-size:11px;font-weight:600;border-radius:12px}
#tabs button b{display:block;font-size:22px;transition:transform .25s}#tabs button.on{color:var(--a);background:#f5b94214}#tabs button.on b{transform:translateY(-3px) scale(1.15)}
#bdg{position:absolute;top:0;margin-inline-start:14px;background:var(--r);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px}
#dice{position:fixed;inset:0;background:#000a;z-index:99;display:none;align-items:center;justify-content:center}
#dice>div{width:min(96vw,380px);background:var(--c);border-radius:22px;padding:16px;text-align:center;animation:up .3s both}
#stw{direction:ltr}#stg{perspective:700px;position:relative;width:320px;height:240px;margin:0 auto;overflow:hidden;direction:ltr;border-radius:14px;background:linear-gradient(#2a3150,#1a1f2e);transform-origin:top center}#dt{font-weight:800;font-size:20px;min-height:28px}
#lock{text-align:center;padding:70px 10px}.sc{background:var(--bg);line-height:1.9;border-radius:14px;padding:12px;margin-bottom:10px;animation:up .4s both}
.sc button{margin-top:6px;border:1px solid #8b93a744;width:100%}
.coin{perspective:240px}.coin i{display:block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1b8,#f5b942 55%,#b9770e);border:2px solid #d89a1d;box-shadow:inset 0 0 0 3px #ffd36b66;animation:cf .5s linear infinite}
@keyframes cf{to{transform:rotateY(360deg)}}@keyframes f3{from{transform:rotateY(180deg) scale(.6)}}
#co{text-shadow:0 1px 0 #b9770e,0 2px 0 #a8680b,0 3px 0 #96590a,0 4px 0 #834908,0 8px 10px #0007}
.tile{transform-style:preserve-3d;box-shadow:0 6px 0 #0005,0 12px 14px #0004}.tile:active:not(:disabled){transform:perspective(300px) rotateX(20deg) translateY(4px)!important;box-shadow:0 1px 0 #0005}
.ic{filter:drop-shadow(0 7px 4px #0006)}#tabs button.on b{animation:f3 .5s}
.av{box-shadow:0 5px 0 #b9770e,0 9px 10px #0005}button{box-shadow:0 3px 0 #0003}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="toast"></div>
<div id="dice"><div><div id="who" class="m" style="min-height:20px"></div><div id="stw"><div id="stg"></div></div><div id="dt"></div><div class="m" style="margin-top:6px;font-size:11px">برای رد کردن لمس کن</div></div></div>
<div id="lock" style="display:none"><h1>🔒</h1><p>این بازی فقط از داخل بات تلگرام اجرا می‌شود.</p><p class="m" id="why" dir="ltr"></p><button onclick="location.reload()">🔄 تلاش دوباره</button></div>
<div id="app" style="display:none">
<section class="pg on" id="p-home">
<div class="c hero"><div class="av" id="av"></div><b id="nm" style="font-size:17px"></b> <span class="m" id="adm"></span>
<div>🪙 <span id="co">0</span></div>
<div class="pills"><span class="pill">⭐ سطح <span id="lv"></span></span><span class="pill">🔥 <span id="st"></span> روز</span><span class="pill m" id="xt"></span></div>
<div class="bar"><i id="xb"></i></div></div>
<div class="tiles"><button id="bm" class="tile"><span class="ic">⛏</span>معدن<span class="t" id="tm"></span></button><button id="bd" class="tile"><span class="ic">🎁</span>روزانه<span class="t" id="td"></span></button><button id="bw" class="tile"><span class="ic">✨</span>گردونه<span class="t" id="tw"></span></button></div>
<div class="c"><b>🥷 دزدی</b> <span class="m" id="sw"></span><input id="acc" placeholder="شماره حساب هدف (یا از لیدربرد بزن)" inputmode="numeric"><button id="bs" style="width:100%">🥷 دزدی کن</button>
<div class="m" style="margin-top:12px">حساب تو:</div><div class="acc"><code id="ma"></code><button id="cp">📋 کپی</button></div></div>
<button class="g" id="dl" style="width:100%">📥 دریافت فایل بازی</button>
</section>
<section class="pg" id="p-games"><div class="c"><b>🎮 بخش‌های بازی</b><div id="scr" style="margin-top:10px"></div>
<div class="row" style="margin-top:8px"><input id="ti" placeholder="ورودی متنی (مبلغ، شماره حساب، ...)" style="margin:0"><button id="tb" style="flex:none">ارسال</button></div>
<button class="g" id="home" style="width:100%;margin-top:8px">🏠 منوی اصلی بخش‌ها</button></div></section>
<section class="pg" id="p-shop"><div class="c"><b>⚒ کارگاه</b><div id="shop"></div></div></section>

<section class="pg" id="p-inbox"><div class="c"><b>📩 پیام‌ها</b><div id="ib" class="m" style="margin-top:8px">در حال بارگذاری...</div></div></section>
<section class="pg" id="p-admin">
<div class="c" id="ac"><b>🔴 ثبت ادمین</b><input id="code" type="password" placeholder="کد ادمین" autocomplete="off"><button id="bc" style="width:100%">ثبت</button></div>
<div class="c" id="adminp" style="display:none"><b>👑 پنل ادمین</b><button id="op" style="width:100%;margin:10px 0 4px">🛰 مرکز فرماندهی ادمین</button><div id="ascr" style="margin-top:8px"></div>
<div class="row"><input id="ti2" placeholder="ورودی برای عملیات ادمین (شماره حساب، مبلغ، ...)" style="margin:0"><button id="tb2" style="flex:none">ارسال</button></div>
<div class="m" style="margin-top:14px">ریست پول بازیکن (سکه می‌شود ۰)</div><input id="ra" placeholder="شماره حساب یا آیدی بازیکن"><button id="br" class="red" style="width:100%">♻️ ریست حساب بازیکن</button>
<div class="m" style="margin-top:14px">بازگردانی بکاپ (فایل .db)</div><input id="rf" type="file" accept=".db"><button id="rb" class="g" style="width:100%">📦 بازگردانی بکاپ</button></div></section>
</div>
<nav id="tabs" style="display:none"><button data-p="home" class="on"><b>🏠</b>خانه</button><button data-p="games"><b>🎮</b>بازی‌ها</button><button data-p="shop"><b>⚒</b>کارگاه</button><button data-p="top"><b>🏆</b>رتبه</button><button data-p="inbox"><b>📩</b>پیام<span id="bdg" style="display:none"></span></button><button data-p="admin" id="tadm"><b>🔴</b>ادمین</button></nav>
<script>
const API="__API__"||location.origin,tg=(window.Telegram&&Telegram.WebApp)||{ready(){},expand(){},openLink(u){open(u)}},init=tg.initData||new URLSearchParams(location.hash.slice(1)).get("tgWebAppData")||"";
const $=i=>document.getElementById(i),f=n=>Number(n).toLocaleString("fa"),sl=ms=>new Promise(r=>setTimeout(r,ms));
let M,tm,tt,last=null,lastLv=null,B=[],BA=[];
async function call(a,b={}){const r=await fetch(API+"/api/"+a,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...b,init})});return r.json()}
function toast(t){if(!t)return;const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),3200)}
function coins(em){for(let i=0;i<12;i++){const c=document.createElement("div");c.className="coin";if(em)c.textContent=em;else c.innerHTML="<i></i>";c.style.left=(25+Math.random()*50)+"vw";c.style.top="35vh";c.style.setProperty("--x",(Math.random()*140-70)+"px");document.body.append(c);setTimeout(()=>c.remove(),1200)}}
async function busy(b,fn){if(b)b.classList.add("busy");try{return await fn()}finally{if(b)b.classList.remove("busy")}}
function count(el,from,to){const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/700);el.textContent=f(Math.round(from+(to-from)*k));if(k<1)requestAnimationFrame(s)})(t0)}
function go(p){document.querySelectorAll(".pg").forEach(x=>x.classList.toggle("on",x.id=="p-"+p));document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x.dataset.p==p));scrollTo({top:0,behavior:"smooth"});if(p=="top")loadTop();if(p=="inbox")loadInbox();if(p=="games"&&!B.length)ui({text:"/start"})}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>go(b.dataset.p));
function show(m){M=m;$("nm").textContent=m.name;$("av").textContent=[...(m.name||"?")][0];$("adm").textContent=m.is_admin?"👑 ادمین":"";
if(lastLv!==null&&m.level>lastLv){coins("🎉");coins("⭐");toast("🎉 سطح جدید: "+f(m.level))}lastLv=m.level;
const old=last;last=m.coins;if(old!==null&&old!==m.coins){count($("co"),old,m.coins);if(m.coins>old){$("co").classList.remove("pop");void $("co").offsetWidth;$("co").classList.add("pop");coins()}}else $("co").textContent=f(m.coins);
$("lv").textContent=f(m.level);$("st").textContent=f(m.streak);$("xb").style.width=(m.need?100*m.cur/m.need:100)+"%";$("xt").textContent=f(m.xp)+" XP";
$("ma").textContent=m.account||"";$("ac").style.display=m.admin_taken?"none":"block";$("adminp").style.display=m.is_admin?"block":"none";$("tadm").style.display=(m.is_admin||!m.admin_taken)?"":"none";
const u=$("bdg");u.style.display=m.unread?"inline":"none";u.textContent=m.unread;
$("shop").innerHTML=m.shop.map((x,i)=>`<div class="li" style="animation-delay:${i*60}ms"><span>${x.n} <span class="m">${f(x.lv)}/∞</span></span><button onclick="act('buy',{kind:'${x.k}'},this)">${f(x.cost)} 🪙</button></div>`).join("");tick()}
function tick(){clearInterval(tm);const u=()=>{for(const[k,b,t]of[["mine_wait","bm","tm"],["daily_wait","bd","td"],["wheel_wait","bw","tw"],["steal_wait","bs",""]]){const w=M[k];$(b).disabled=w>0;if(t)$(t).textContent=w>0?"⏳ "+(w>=60?Math.ceil(w/60)+" د":w+" ث"):"آماده";if(w>0)M[k]--}$("sw").textContent=M.steal_wait>0?"⏳ "+Math.ceil(M.steal_wait/60)+" دقیقه":""};u();tm=setInterval(u,1e3)}
async function loadTop(){const r=await call("top");$("top").innerHTML=(r.top||[]).map((p,i)=>`<div class="li ${p.me?"me":""}" style="animation-delay:${i*40}ms"><span>${["🥇","🥈","🥉"][i]||(i+1)+"."} ${p.name.replace(/</g,"&lt;")}</span><span>سطح ${f(p.level)} · ${f(p.xp)} ${p.me?"":`<a href="#" onclick="act('steal',{target:${p.id}});return false">🥷</a>`}</span></div>`).join("")}
async function loadInbox(){const r=await call("inbox");$("ib").innerHTML=(r.inbox||[]).map((i,k)=>`<div class="sc" style="animation-delay:${k*50}ms"><div>${i.text.replace(/</g,"&lt;").replace(/\n/g,"<br>")}</div><div class="m">${new Date(i.t*1000).toLocaleString("fa")}</div></div>`).join("")||"پیامی نداری";if(r.me)show(r.me)}
async function act(a,b,btn){await busy(btn,async()=>{try{const r=await call(a,b||{});toast(r.text||r.error||"خطا");if(r.me)show(r.me);if($("p-top").classList.contains("on"))loadTop()}catch(x){toast("❌ ارتباط با سرور قطع شد")}});if(btn&&btn.classList&&btn.classList.contains("tile")){btn.classList.remove("do");void btn.offsetWidth;btn.classList.add("do")}}
function render(evs,a){let A=a?BA:B;const T=[];let st=false;for(const e of evs){if(e.k=="toast")T.push(e.t);else if(e.k=="send"){if(!st){A=[];st=true}A.push(e)}else if(e.k=="edit"){if(A.length)A[A.length-1]=e;else A=[e]}else if(e.k=="markup"&&A.length)A[A.length-1].b=e.b}
if(a)BA=A;else B=A;$(a?"ascr":"scr").innerHTML=A.map((b,i)=>`<div class="sc"><div>${b.t.replace(/\n/g,"<br>")}</div>`+(b.b||[]).map((r,j)=>`<div class="row">`+r.map((x,k)=>`<button class="g" data-i="${i}-${j}-${k}">${x.t}</button>`).join("")+"</div>").join("")+"</div>").join("");if(T.length)toast(T.join(" · "))}
async function ui(b,a){try{const r=await call("ui",b);if(r.error){toast(r.error);return}const dv=(r.events||[]).filter(e=>e.k=="dice");if(dv.length)await dice(dv);render(r.events||[],a);if(r.me)show(r.me)}catch(x){toast("❌ ارتباط با سرور قطع شد")}}
const clk=a=>e=>{const b=e.target.closest("button");if(!b)return;const[i,j,k]=b.dataset.i.split("-").map(Number),x=(a?BA:B)[i].b[j][k];x.u?tg.openLink(x.u):busy(b,()=>ui({d:x.d},a))};
$("scr").onclick=clk(0);$("ascr").onclick=clk(1);
$("op").onclick=e=>busy(e.currentTarget,async()=>{try{const r=await call("admin_panel");if(r.error)return toast(r.error);render(r.events||[],1)}catch(x){toast("❌ ارتباط با سرور قطع شد")}});
$("tb2").onclick=()=>{const v=$("ti2").value;$("ti2").value="";if(v)ui({text:v},1)};
async function dice(L){
const d=$("dice"),st=$("stg"),card=d.firstElementChild;let SK=false;d.onclick=()=>SK=true;d.style.display="flex";
const k=Math.min(1,(card.clientWidth-32)/320),sw=$("stw");st.style.transform=`scale(${k})`;st.style.transformOrigin="0 0";st.style.margin="0";sw.style.width=320*k+"px";sw.style.height=240*k+"px";sw.style.margin="0 auto";
const w=ms=>sl(SK?0:ms),C="translate(-50%,-50%)";
const el=(css,txt="",par=st)=>{const x=document.createElement("div");x.style.cssText="position:absolute;"+css;x.textContent=txt;par.append(x);return x};
const an=(x,kf,t,o={})=>x.animate(kf,{duration:t,fill:"forwards",easing:"ease-out",...o});
const mv=(pts,x0,y0,d3)=>pts.map(([x,y,sc=1,r=0])=>({transform:`translate(${x-x0}px,${y-y0}px) scale(${sc}) `+`rotate(${r*(d3?1.4:1)}deg)`}));
const stamp=(t,c)=>{const x=el(`left:0;right:0;top:86px;text-align:center;font-size:46px;font-weight:900;color:${c};text-shadow:0 4px 0 #000a,0 0 18px #000a;z-index:9`,t);an(x,[{transform:"scale(0)",opacity:0},{transform:"scale(1.3)",opacity:1,offset:.6},{transform:"scale(1)",opacity:1}],450)};
const sky=(a,b)=>st.style.background=`linear-gradient(${a},${b})`;
const crowd=(top,h,al)=>el(`left:0;top:${top}px;width:320px;height:${h}px;opacity:${al};background:radial-gradient(circle,#e5484d 36%,#0000 40%) 0 0/13px 13px,radial-gradient(circle,#f5b942 36%,#0000 40%) 6px 5px/17px 17px,radial-gradient(circle,#4da3ff 36%,#0000 40%) 10px 2px/19px 19px,radial-gradient(circle,#fff 30%,#0000 34%) 3px 8px/23px 23px`);
const man=(x,y,col,k,par)=>{const r=el(`left:${x}px;top:${y}px;width:0;height:0;transform:scale(${k});transform-origin:0 0;z-index:4`,"",par),pt=c=>el(c,"",r);
const legL=pt("left:-9px;top:-26px;width:8px;height:26px;background:#1f2a44;border-radius:3px;transform-origin:50% 0"),legR=pt("left:1px;top:-26px;width:8px;height:26px;background:#1f2a44;border-radius:3px;transform-origin:50% 0");
