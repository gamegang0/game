<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script><title>بازی سکه</title>
<style>
:root{--bg:#10131a;--c:#1b2030;--t:#eef1f7;--m:#8b93a7;--a:#f5b942}
@media(prefers-color-scheme:light){:root{--bg:#f3f4f8;--c:#fff;--t:#161a24;--m:#667;--a:#c98a0a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Tahoma,system-ui,sans-serif;padding:14px}
.c{background:var(--c);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px}button{flex:1;border:0;border-radius:12px;padding:13px;font:inherit;background:var(--a);color:#111;font-weight:700}
button:disabled{opacity:.45}.g{background:var(--bg);color:var(--t)}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--a)}
.m{color:var(--m);font-size:13px}.li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bg)}.li.me{color:var(--a);font-weight:700}
input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--m);background:var(--bg);color:var(--t);margin:8px 0}
#lock{text-align:center;padding:60px 10px}#toast{min-height:22px;text-align:center;margin:8px 0}
</style></head><body>
<div id="lock" style="display:none"><h2>🔒</h2><p>این بازی فقط از داخل بات تلگرام اجرا می‌شود.</p></div>
<div id="app" style="display:none">
<div class="c"><b id="nm"></b> <span class="m" id="adm"></span>
<div>🪙 <span id="co"></span> · سطح <span id="lv"></span> · 🔥 <span id="st"></span></div>
<div class="bar"><i id="xb"></i></div><div class="m" id="xt"></div></div>
<div class="row"><button id="bm">⛏ معدن</button><button id="bd">🎁 روزانه</button><button id="bw">✨ گردونه</button></div>
<div id="toast" class="m"></div>
<div class="c"><b>📩 پیام‌ها</b> <span id="ub" class="m"></span><div id="ib" class="m">برای دیدن پیام‌ها بزن</div><button class="g" id="bi" style="margin-top:8px">باز کردن صندوق پیام</button></div>
<div class="c"><b>🥷 دزدی</b> <span class="m" id="sw"></span><input id="acc" placeholder="شماره حساب هدف (یا از لیدربرد بزن)"><button id="bs">🥷 دزدی کن</button><div class="m">حساب تو: <span id="ma"></span></div></div>
<div class="c"><b>⚒ کارگاه</b><div id="shop"></div></div>
<div class="c"><b>📋 همه‌ی بخش‌های بازی</b><div id="scr" style="margin-top:8px"></div>
<div class="row" style="margin-top:8px"><input id="ti" placeholder="ورودی متنی (مبلغ، شماره حساب، ...)" style="margin:0"><button id="tb" style="flex:none">ارسال</button></div>
<button class="g" id="home" style="margin-top:8px">🏠 منوی اصلی</button></div>
<div class="c"><b>🏆 لیدربرد</b><div id="top"></div></div>
<div class="c" id="ac"><b>🔴 ادمین</b><input id="code" type="password" placeholder="کد ادمین"><button id="bc">ثبت</button></div>
<button class="g" id="dl">📥 دریافت فایل بازی</button>
</div>
<script>
const API="__API__"||location.origin,tg=window.Telegram&&Telegram.WebApp,init=tg&&tg.initData;
const $=i=>document.getElementById(i),f=n=>Number(n).toLocaleString("fa");
let M,tm;
async function call(a,b={}){const r=await fetch(API+"/api/"+a,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...b,init})});return r.json()}
function show(m){M=m;$("nm").textContent=m.name;$("adm").textContent=m.is_admin?"👑 ادمین":"";$("co").textContent=f(m.coins);$("lv").textContent=f(m.level);$("st").textContent=f(m.streak);
$("xb").style.width=(m.need?100*m.cur/m.need:100)+"%";$("xt").textContent=f(m.xp)+" XP";$("ac").style.display=m.admin_taken?"none":"block";$("ub").textContent=m.unread?"🔴 "+f(m.unread)+" جدید":"";$("ma").textContent=m.account||"";
$("shop").innerHTML=m.shop.map(x=>`<div class="li"><span>${x.n} ${f(x.lv)}/${f(x.mx)}</span><button style="flex:none;padding:6px 12px" onclick="act('buy',{kind:'${x.k}'})">${f(x.cost)} 🪙</button></div>`).join("");tick()}
function tick(){clearInterval(tm);const u=()=>{for(const[k,b]of[["mine_wait","bm"],["daily_wait","bd"],["wheel_wait","bw"],["steal_wait","bs"]]){const w=M[k];$(b).disabled=w>0;if(w>0)M[k]--}$("sw").textContent=M.steal_wait>0?"⏳ "+Math.ceil(M.steal_wait/60)+" دقیقه":"";};u();tm=setInterval(u,1e3)}
async function loadTop(){const r=await call("top");$("top").innerHTML=(r.top||[]).map((p,i)=>`<div class="li ${p.me?"me":""}"><span>${i+1}. ${p.name.replace(/</g,"&lt;")}</span><span>سطح ${f(p.level)} · ${f(p.xp)} ${p.me?"":`<a href="#" onclick="act('steal',{target:${p.id}});return false">🥷</a>`}</span></div>`).join("")}
async function act(a,b){const r=await call(a,b);$("toast").textContent=r.text||r.error||"";if(r.me)show(r.me);loadTop()}
let B=[];
function render(evs){const T=[];let st=false;for(const e of evs){if(e.k=="toast"||e.k=="dice")T.push(e.t);else if(e.k=="send"){if(!st){B=[];st=true}B.push(e)}else if(e.k=="edit"){if(B.length)B[B.length-1]=e;else B=[e]}else if(e.k=="markup"&&B.length)B[B.length-1].b=e.b}
$("scr").innerHTML=B.map((b,i)=>`<div class="c" style="background:var(--bg);line-height:1.8"><div>${b.t.replace(/\n/g,"<br>")}</div>`+(b.b||[]).map((r,j)=>`<div class="row" style="margin-top:6px">`+r.map((x,k)=>`<button class="g" data-i="${i}-${j}-${k}" style="padding:10px;border:1px solid var(--m)">${x.t}</button>`).join("")+"</div>").join("")+"</div>").join("");
if(T.length)$("toast").textContent=T.join(" · ")}
async function ui(b){const r=await call("ui",b);if(r.error){$("toast").textContent=r.error;return}render(r.events||[]);if(r.me)show(r.me)}
$("scr").onclick=e=>{const b=e.target.closest("button");if(!b)return;const[i,j,k]=b.dataset.i.split("-").map(Number),x=B[i].b[j][k];x.u?tg.openLink(x.u):ui({d:x.d})};
$("tb").onclick=()=>{const v=$("ti").value;$("ti").value="";if(v)ui({text:v})};$("home").onclick=()=>ui({text:"/start"});
$("bm").onclick=()=>act("mine");$("bw").onclick=()=>act("wheel");$("bs").onclick=()=>act("steal",{account:$("acc").value});
$("bi").onclick=async()=>{const r=await call("inbox");$("ib").innerHTML=(r.inbox||[]).map(i=>`<div class="li" style="display:block"><div>${i.text.replace(/</g,"&lt;").replace(/\n/g,"<br>")}</div><div class="m">${new Date(i.t*1000).toLocaleString("fa")}</div></div>`).join("")||"پیامی نداری";if(r.me)show(r.me)};$("bd").onclick=()=>act("daily");$("bc").onclick=()=>act("admin_claim",{code:$("code").value});
$("dl").onclick=()=>{const u=API+"/game.html";tg.downloadFile?tg.downloadFile({url:u,file_name:"game.html"}):tg.openLink(u)};
(async()=>{if(!init){$("lock").style.display="block";return}tg.ready();tg.expand();$("app").style.display="block";const r=await call("me");if(r.error){$("app").style.display="none";$("lock").style.display="block";return}show(r.me);loadTop();ui({text:"/start"})})();
</script></body></html>
