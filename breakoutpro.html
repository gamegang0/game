<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BREAKOUT</title>
<meta name="game-icon" content="🧱">
<meta name="game-name" content="BREAKOUT">
<meta name="game-desc" content="۱۰۰ مرحله، ۱۰ باس و ۲۸ جایزه؛ هرچی جلوتر سخت‌تر">
<meta name="game-color" content="#e8943a">
<meta name="game-portrait" content="1">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#2b1a10;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;background:#000;font-size:15px}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;gap:.5em;padding:1em;background:rgba(48,28,14,.72);color:#fff4dc;text-align:center;overflow-y:auto}
.scr>:first-child{margin-top:auto}.scr>:last-child{margin-bottom:auto}
.scr.on{display:flex}
.scr.solid{background:linear-gradient(#5a3418ee,#2f1b0cf2)}
.logo{direction:ltr;font-size:3.05em;font-weight:900;letter-spacing:.04em;color:#fff0c4;line-height:1;margin-bottom:.1em;text-shadow:0 .04em 0 #f0b04a,0 .09em 0 #d9822a,0 .14em 0 #a85c18,0 .19em 0 #6e3a0e,0 .3em .25em rgba(0,0,0,.55)}
.sub{font-size:.95em;color:#ffe2a8;margin-bottom:.5em;text-shadow:0 .08em .15em #0008}
h2{font-size:1.6em;color:#ffe2a8;text-shadow:0 .08em 0 #7a4412,0 .15em .2em #0008}
.btn{width:78%;max-width:20em;padding:.62em .5em;border-radius:.85em;border:.1em solid #6d3a12;background:linear-gradient(#ffd687,#eea04a 55%,#cf7424);color:#3d1f08;font:inherit;font-weight:800;font-size:1.15em;box-shadow:0 .2em 0 #8c4a14,0 .36em .5em rgba(0,0,0,.4);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(.16em);box-shadow:0 .05em 0 #8c4a14,0 .12em .3em rgba(0,0,0,.4)}
.btn.sm{width:auto;padding:.45em 1em;font-size:1em}
.btn.alt{background:linear-gradient(#e9dcc4,#c9b48c 55%,#a8916a);border-color:#5e4a2c;box-shadow:0 .2em 0 #6e5a38,0 .36em .5em rgba(0,0,0,.4)}
.btn.off{opacity:.45;pointer-events:none}
.row{display:flex;gap:.6em;width:100%;justify-content:center;flex-wrap:wrap}
.panel{width:92%;background:rgba(255,238,205,.12);border:.08em solid #ffe2a855;border-radius:.8em;padding:.7em;text-align:right;line-height:1.9;font-size:.95em}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.5em;width:92%}
.lv{aspect-ratio:1;border-radius:.7em;border:.1em solid #6d3a12;background:linear-gradient(#ffd687,#eea04a 60%,#cf7424);color:#3d1f08;font:inherit;font-weight:900;font-size:1.25em;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;box-shadow:0 .15em 0 #8c4a14}
.lv small{font-size:.5em}
.lv.lock{opacity:.4;background:#8a7a68;box-shadow:none;pointer-events:none}
.lv.boss{background:linear-gradient(#ffe9a6,#f0b928 60%,#b9811a)}
.tg{display:flex;justify-content:space-between;align-items:center;width:92%;padding:.45em .8em;background:rgba(255,238,205,.14);border-radius:.7em;font-weight:700}
.sw{width:3em;height:1.6em;border-radius:1em;background:#7a6a58;position:relative;border:.1em solid #3d2a14;cursor:pointer}
.sw:after{content:"";position:absolute;top:.15em;right:.15em;width:1.1em;height:1.1em;border-radius:50%;background:#fff4dc;transition:transform .15s}
.sw.on{background:#4fa86b}
.sw.on:after{transform:translateX(-1.4em)}
.seg{display:flex;gap:.3em}
.seg button{padding:.3em .7em;border-radius:.6em;border:.08em solid #3d2a14;background:#c9b48c;color:#3d1f08;font:inherit;font-weight:700;cursor:pointer}
.seg button.on{background:#eea04a}
#bPause,#bFs{position:absolute;top:.35em;width:2.3em;height:2.3em;border-radius:.6em;border:.08em solid #ffe2a8;background:rgba(60,36,18,.7);color:#ffe2a8;font:inherit;font-size:1em;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:5}
#bPause{left:.4em}#bFs{left:3em}
#bLaunch{position:absolute;bottom:.7em;left:50%;transform:translateX(-50%);display:none;padding:.5em 1.6em;border-radius:2em;border:.1em solid #6d3a12;background:linear-gradient(#ffd687,#eea04a);color:#3d1f08;font:inherit;font-weight:900;font-size:1.05em;z-index:5;box-shadow:0 .2em 0 #8c4a14;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.08)}}
#toast{position:absolute;top:6.2em;left:50%;transform:translateX(-50%);max-width:90%;padding:.4em 1em;border-radius:1em;background:rgba(40,24,12,.88);color:#ffe9b8;font-weight:700;font-size:.95em;display:none;z-index:9;text-align:center}
.big{font-size:2.1em;font-weight:900;color:#ffe9b8;text-shadow:0 .06em 0 #7a4412}
.stars{font-size:2.2em;letter-spacing:.2em}
.legend{display:grid;grid-template-columns:auto 1fr;gap:.1em .6em;align-items:center}
.legend b{font-size:1.15em}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <button id="bPause" aria-label="مکث">⏸</button>
  <button id="bFs" aria-label="تمام‌صفحه">⛶</button>
  <button id="bLaunch">پرتاب توپ</button>
  <div id="toast"></div>

  <div class="scr" id="sMenu">
    <div class="logo">BREAKOUT</div>
    <div class="sub">آجرها رو بشکن، باس‌ها رو شکست بده</div>
    <button class="btn" id="mStart">▶ شروع بازی</button>
    <button class="btn alt" id="mCont">⏩ ادامه بازی</button>
    <button class="btn alt" id="mLevels">🗺️ انتخاب مرحله</button>
    <div class="row"><button class="btn sm alt" id="mRec">🏆 رکورد</button><button class="btn sm alt" id="mHelp">❓ راهنما</button><button class="btn sm alt" id="mSet">⚙️ تنظیمات</button></div>
    <div class="row"><button class="btn sm" id="mFs">⛶ تمام‌صفحه</button><button class="btn sm alt" id="mHome" style="display:none">↩ خروج به آرکید</button></div>
  </div>

  <div class="scr solid" id="sLevels">
    <h2>انتخاب مرحله</h2>
    <div class="sub" id="lvInfo"></div>
    <div class="grid" id="lvGrid"></div>
    <button class="btn alt" data-back>↩ بازگشت</button>
  </div>

  <div class="scr solid" id="sRec">
    <h2>🏆 رکورد</h2>
    <div class="panel" id="recBox"></div>
    <div class="row"><button class="btn sm alt" id="recReset">🗑️ پاک‌کردن رکورد</button><button class="btn sm" data-back>↩ بازگشت</button></div>
  </div>

  <div class="scr solid" id="sHelp">
    <h2>❓ راهنمای بازی</h2>
    <div class="panel" id="helpBox"></div>
    <button class="btn alt" data-back>↩ بازگشت</button>
  </div>

  <div class="scr solid" id="sSet">
    <h2>⚙️ تنظیمات</h2>
    <div class="tg"><span>🔊 صدای افکت‌ها</span><div class="sw" id="tSound"></div></div>
    <div class="tg"><span>🎵 موسیقی</span><div class="sw" id="tMusic"></div></div>
    <div class="tg"><span>📳 لرزش دستگاه</span><div class="sw" id="tVib"></div></div>
    <div class="tg"><span>🫨 لرزش تصویر</span><div class="sw" id="tShake"></div></div>
    <div class="tg"><span>🎨 کیفیت گرافیک</span><div class="seg" id="qSeg"><button data-q="0">پایین</button><button data-q="1">متوسط</button><button data-q="2">بالا</button></div></div>
    <button class="btn sm" id="sFs">⛶ تمام‌صفحه</button>
    <button class="btn alt" data-back>↩ بازگشت</button>
  </div>

  <div class="scr" id="sPause">
    <h2>⏸ مکث</h2>
    <button class="btn" id="pResume">▶ ادامه</button>
    <button class="btn alt" id="pRestart">🔁 تلاش دوباره (همین مرحله) مرحله</button>
    <div class="row"><button class="btn sm alt" id="pSound">🔊 صدا</button><button class="btn sm alt" id="pMusic">🎵 موسیقی</button><button class="btn sm" id="pFs">⛶</button></div>
    <button class="btn alt" id="pMenu">🏠 بازگشت به منو</button>
    <button class="btn alt" id="pHome" style="display:none">↩ خروج به آرکید</button>
  </div>

  <div class="scr" id="sWin">
    <div class="stars">⭐⭐⭐</div>
    <div class="big" id="wTitle">مرحله کامل شد!</div>
    <div class="panel" id="wInfo" style="text-align:center"></div>
    <button class="btn" id="wNext">مرحله بعد ▶</button>
  </div>

  <div class="scr" id="sOver">
    <div class="big" id="oTitle">پایان بازی</div>
    <div class="panel" id="oInfo" style="text-align:center"></div>
    <button class="btn" id="oAgain">🔁 تلاش دوباره (همین مرحله)</button>
    <button class="btn alt" id="oMenu">🏠 بازگشت به منو</button>
    <button class="btn alt" id="oHome" style="display:none">↩ خروج به آرکید</button>
  </div>
</div>

<script>
'use strict';
/* ================= پایه ================= */
const W=360,H=640,GAME_ID='breakoutpro',MAXL=100;
const $=id=>document.getElementById(id);
const fa=n=>Math.round(n).toLocaleString('fa-IR');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const EMB=(()=>{try{return window.parent!==window}catch(e){return false}})();
let runPosted=false,lastPost=0,pendPost=false;
function post(type,score,won){if(!EMB)return;try{window.parent.postMessage({source:'nova-arcade-embed',game:GAME_ID,type,score:Math.max(0,Math.floor(score||0)),won:!!won},'*')}catch(e){}}
function postScore(force){const n=performance.now();if(force||n-lastPost>300){lastPost=n;pendPost=false;if(!runPosted){runPosted=true;post('start',0)}post('score',G.score)}else pendPost=true}

/* ذخیره‌سازی */
const SK='breakoutpro_v1';
const store={best:0,maxLevel:1,save:null,set:{sound:true,music:true,vib:true,shake:true,q:1}};
try{const j=JSON.parse(localStorage.getItem(SK)||'null');if(j&&typeof j==='object'){store.best=+j.best||0;store.maxLevel=clamp(+j.maxLevel||1,1,MAXL);store.save=j.save&&j.save.level?j.save:null;Object.assign(store.set,j.set||{})}}catch(e){}
function persist(){try{localStorage.setItem(SK,JSON.stringify(store))}catch(e){}}

/* ================= صدا ================= */
let AC=null,master,sfxG,musG,nbuf,active=0;const lastS={};
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.85;master.connect(AC.destination);
    sfxG=AC.createGain();sfxG.gain.value=.9;sfxG.connect(master);
    musG=AC.createGain();musG.gain.value=.2;musG.connect(master);
    nbuf=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null}
}
function ok(key,gap){const n=performance.now();if(lastS[key]&&n-lastS[key]<gap)return false;lastS[key]=n;return true}
function tone(f,d,type,v,slide,t0,dest){
  if(!AC||!store.set.sound||active>22)return;
  const t=AC.currentTime+(t0||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest||sfxG);active++;o.onended=()=>{active--};o.start(t);o.stop(t+d+.03);
}
function noise(d,v,fq,type,t0,slide){
  if(!AC||!store.set.sound||active>22)return;
  const t=AC.currentTime+(t0||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nbuf;f.type=type||'lowpass';f.frequency.setValueAtTime(fq||2000,t);if(slide)f.frequency.exponentialRampToValueAtTime(Math.max(80,fq+slide),t+d);
  g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(sfxG);active++;s.onended=()=>{active--};s.start(t);s.stop(t+d+.03);
}
const SFX={
  click(){tone(660,.07,'square',.06,200)},
  paddle(){if(ok('p',50))tone(220,.09,'triangle',.16,-60)},
  wall(){if(ok('w',40))tone(520,.04,'sine',.05)},
  hit(t){if(!ok('h',30))return;
    if(t==='metal'){tone(1400,.1,'square',.06,-300);tone(900,.12,'triangle',.07)}
    else if(t==='stone'){tone(150,.1,'triangle',.18,-40);noise(.06,.1,500)}
    else if(t==='glass'||t==='ice'){tone(2200,.08,'sine',.07,-600);tone(3000,.05,'sine',.04)}
    else if(t==='gold'){tone(1200,.12,'triangle',.08,300);tone(1800,.1,'sine',.05,0,.04)}
    else tone(380,.07,'square',.07,-80)},
  brk(t){if(!ok('b',25))return;
    if(t==='metal'){noise(.18,.14,3500,'bandpass');tone(200,.18,'sawtooth',.08,-120)}
    else if(t==='stone'){noise(.22,.2,700);tone(100,.2,'triangle',.18,-40)}
    else if(t==='glass'||t==='ice'){noise(.2,.12,6000,'highpass');tone(2600,.15,'sine',.06,-1200)}
    else if(t==='gold'){tone(988,.1,'triangle',.1);tone(1318,.12,'triangle',.1,0,.07);tone(1760,.16,'triangle',.08,0,.14)}
    else if(t==='expl'){noise(.45,.3,900,'lowpass',0,-500);tone(70,.4,'sawtooth',.2,-30)}
    else{noise(.1,.14,2500);tone(300,.08,'square',.06,-100)}},
  pickup(){tone(660,.08,'triangle',.1);tone(990,.1,'triangle',.1,0,.06)},
  power(id){const n={coin:[880,1320],multi:[440,660,880],fire:[300,500,700],wide:[330,495],small:[400,260],shield:[500,750],life:[523,659,784,1046],slow:[500,380],fast:[400,620],bolt:[1200,300],laser:[900,1300],chest:[392,523,659],crystal:[1046,1318,1568,2093],magnet:[330,440],ball:[600,800],mult:[700,1050],chain:[200,120],myst:[500,700,600],gem:[523,659,784,1046,1318]}[id]||[600];
    n.forEach((f,i)=>tone(f,.13,id==='small'||id==='fast'?'sawtooth':'triangle',.1,0,i*.07))},
  laser(){if(ok('l',60))tone(1500,.1,'square',.05,-900)},
  zap(){noise(.25,.16,3000,'bandpass',0,-1500);tone(900,.2,'sawtooth',.06,-500)},
  lose(){[400,330,260,180].forEach((f,i)=>tone(f,.2,'sawtooth',.12,0,i*.12))},
  win(){[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.16,'triangle',.12,0,i*.09))},
  boss(){tone(90,.6,'sawtooth',.15,-20);tone(95,.6,'square',.07,-20,.05)},
  bossHit(){if(ok('bh',60)){tone(130,.12,'square',.14,-50);noise(.1,.12,900)}},
  bossDie(){noise(1.1,.3,1200,'lowpass',0,-900);[130,100,70,50].forEach((f,i)=>tone(f,.4,'sawtooth',.16,-20,i*.15));setTimeout(()=>SFX.win(),700)},
  stun(){tone(150,.3,'sawtooth',.14,-80);noise(.2,.1,600)},
  shield(){if(ok('s',80)){tone(700,.1,'sine',.1,300)}}
};
/* موسیقی */
const MUS={t:0,step:0,timer:0};
const LEAD=[0,4,7,4,9,7,4,2, 0,4,7,12,9,7,4,7],BASS=[0,0,7,7,5,5,7,7];
const BLEAD=[0,3,7,3,8,7,3,1, 0,3,7,10,8,7,3,7],BBASS=[0,0,5,5,3,3,7,7];
const hz=(s,b)=>(b||261.63)*Math.pow(2,s/12);
function musTick(){
  if(!AC||!store.set.music||document.hidden||!MUS.on){MUS.t=AC?AC.currentTime+.1:0;return}
  const boss=G.boss&&G.mode!=='menu',bpm=boss?138:112,sd=60/bpm/2;
  if(MUS.t<AC.currentTime)MUS.t=AC.currentTime+.05;
  while(MUS.t<AC.currentTime+.35){
    const i=MUS.step%16,L=boss?BLEAD:LEAD,B=boss?BBASS:BASS;
    const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=hz(L[i]+(boss?0:12));
    g.gain.setValueAtTime(.5,MUS.t);g.gain.exponentialRampToValueAtTime(.001,MUS.t+sd*.9);o.connect(g);g.connect(musG);o.start(MUS.t);o.stop(MUS.t+sd);
    if(i%2===0){const o2=AC.createOscillator(),g2=AC.createGain();o2.type='sine';o2.frequency.value=hz(B[(i>>1)%8],130.8);g2.gain.setValueAtTime(.7,MUS.t);g2.gain.exponentialRampToValueAtTime(.001,MUS.t+sd*1.8);o2.connect(g2);g2.connect(musG);o2.start(MUS.t);o2.stop(MUS.t+sd*2)}
    if(i%4===2){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g3=AC.createGain();s.buffer=nbuf;f.type='highpass';f.frequency.value=7000;g3.gain.setValueAtTime(.12,MUS.t);g3.gain.exponentialRampToValueAtTime(.001,MUS.t+.05);s.connect(f);f.connect(g3);g3.connect(musG);s.start(MUS.t);s.stop(MUS.t+.06)}
    MUS.t+=sd;MUS.step++;
  }
}
function musStart(){MUS.on=true;if(!MUS.timer)MUS.timer=setInterval(musTick,120)}
function musStop(){MUS.on=false}
function vib(p){if(!store.set.vib)return;try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}

/* ================= داده‌ها ================= */
const BW=34,BH=18,OX=18,OY=96,PITCH_X=36,PITCH_Y=20,TOP=62,WL=8,WR=W-8;
const BT={ // hp = سختی (امتیاز = ۵۰۰ × سختی)
  '1':{k:'clay',hp:1,hard:1,drop:.12},'2':{k:'stone',hp:2,hard:2,drop:.18},'3':{k:'metal',hp:3,hard:3,drop:.22},'d':{k:'gold',hp:4,hard:4,drop:.32},
  's':{k:'glass',hp:1,hard:1,drop:.10},'i':{k:'ice',hp:2,hard:2,drop:.14},'m':{k:'wood',hp:2,hard:2,drop:.15,move:true},
  'x':{k:'expl',hp:1,hard:1,drop:.10},'b':{k:'bonus',hp:2,hard:2,drop:1,multi:3},'q':{k:'myst',hp:1,hard:1,drop:1,myst:true},'g':{k:'guard',hp:2,hard:3,drop:.2,shield:true},
  'w':{k:'wall',hp:999,hard:0,drop:0,wall:true},'r':{k:'regen',hp:3,hard:3,drop:.25,regen:true},
  'o':{k:'obsid',hp:5,hard:5,drop:.35},'e':{k:'elec',hp:2,hard:2,drop:.2},'v':{k:'volc',hp:2,hard:2,drop:.15},'j':{k:'metal',hp:3,hard:3,drop:.22,move:true}
};
const LV=[
 {r:['111111111','111111111','111111111']},
 {r:['s1s1s1s1s','1s1s1s1s1','s1s1s1s1s','.........','111111111']},
 {r:['....1....','...212...','..21b12..','.2111112.','222222222']},
 {r:['1...i...1','.1.iii.1.','..1iqi1..','.1.iii.1.','1...i...1']},
 {r:['333333333','2.2.2.2.2','1b1b1b1b1','2.2.2.2.2','333333333']},
 {r:['2222.2222','m.m.m.m.m','111111111','.m.m.m.m.','s3s3s3s3s']},
 {r:['222222222','2x1b1b1x2','2.1xxx1.2','2x1b1b1x2','222222222']},
 {r:['1.......1','.2.....2.','..3.q.3..','...2q2...','....q....','...2q2...','..3.q.3..','.2.....2.','1.......1']},
 {r:['ggggggggg','.2b2q2b2.','g1g1g1g1g','.3x3x3x3.','sssssssss']},
 {boss:1,r0:5,r:['2.2.2.2.2','.1.b.b.1.']},
 {r:['.11...11.','1d1.1.1d1','111111111','.1e111e1.','..11d11..','...111...','....1....']},
 {r:['d11111111','2d1111111','22d111111','222d11111','3222d1111','b3222d111']},

    case'chest':{const o=['coin','multi','fire','wide','shield','laser','mult','life','magnet','crystal'];const w=[3,3,2,2,2,2,2,1,2,.6];let t=0;w.forEach(v=>t+=v);let r=Math.random()*t,pick='coin';for(let i=0;i<o.length;i++){r-=w[i];if(r<=0){pick=o[i];break}}givePower(pick);break}
    case'crystal':addScore(5000,P.x,P.y-44);shake(4);vib([20,30,20]);burst(P.x,P.y-10,['#9fe3ff','#ffffff','#5cc0e8','#d8f6ff'],26,260,.9,0,200);break;
    case'magnet':e.magnet=DUR.magnet;break;

    case'myst':{let q=pickPower();let n=0;while((q==='myst')&&n++<5)q=pickPower();givePower(q==='myst'?'coin':q);break}

/* ================= آجرها ================= */
function stageOf(b){const f=b.hp/b.max;return f>.67?0:f>.34?1:2}
function hitBrick(b,dmg,src){
  if(b.dead)return;
  if(b.isBoss){
    if(b.hitCd>0&&src==='ball')return;b.hitCd=.09;b.hp-=dmg;b.flash=.12;SFX.bossHit();shake(3);vib(10);
    burst(b.x+rand(0,b.w),b.y+b.h*.6,BCOL.stone,5,160,.4);
    if(b.hp<=b.max*.5&&b.phase===1){b.phase=2;toast('💢 باس عصبانی شد!',1800);SFX.boss();shake(7)}
    if(b.hp<=0)killBoss(b);return;
  }
  if(b.wall){SFX.hit('metal');b.flash=.08;burst(b.x+b.w/2,b.y+b.h/2,['#ffd870','#fff'],2,120,.25);return}
  if(b.shield){b.shield=false;b.k='guardCore';b.flash=.12;SFX.hit('metal');burst(b.x+b.w/2,b.y+b.h/2,BCOL.guard,6,150,.4);return}
  b.hp-=dmg;b.flash=.1;G.lastBrk=G.t;
  if(b.hp<=0)killBrick(b);
  else{SFX.hit(b.k==='guardCore'?'metal':b.k==='wood'?'clay':b.k);burst(b.x+b.w/2,b.y+b.h/2,BCOL[b.k]||BCOL.clay,3,120,.35,0,400);if(b.k==='ice')burst(b.x+b.w/2,b.y+b.h/2,['#fff','#cdeffa'],3,180,.4)}
}
function killBrick(b){
  b.dead=true;G.alive--;G.lastBrk=G.t;
  const cx=b.x+b.w/2,cy=b.y+b.h/2,k=b.k;
  addScore(500*b.hard,cx,cy);
  const nn={metal:12,stone:12,gold:14,glass:16,ice:14,expl:0,bonus:14,myst:12}[k]||10;
  burst(cx,cy,BCOL[k]||BCOL.clay,nn,k==='glass'||k==='ice'?210:170,.7,k==='glass'||k==='ice'?1:0);
  if(k==='metal'||k==='guardCore')burst(cx,cy,['#ffe08a','#fff'],6,300,.3,0,300);
  if(k==='gold')burst(cx,cy,['#fff6c8','#ffd84a'],8,200,.9,0,-80);
  SFX.brk(k==='guardCore'?'metal':k==='wood'?'clay':k);
  if(k==='stone'||k==='metal'||k==='gold')shake(2);
  if(b.expl){later(.06,()=>blast(cx,cy,64,1))}
  if(k==='elec')later(.08,()=>lightning(2));
  if(k==='volc')G.haz.push({x:cx,y:cy,vx:0,vy:170,r:8,k:'fire'});
  if(b.myst){dropCap(cx,cy,'myst')}
  else if(b.multi){for(let i=0;i<b.multi;i++)dropCap(cx+rand(-12,12),cy,null)}
  else if(Math.random()<(b.drop+G.level*.002)*(G.eff.lucky>0?1.8:1))dropCap(cx,cy);
}
function killBoss(b){
  b.dead=true;G.alive--;addScore(500*b.hard,b.x+b.w/2,b.y+b.h/2);
  burst(b.x+b.w/2,b.y+b.h/2,['#ffb040','#e8602a','#ffe08a','#bdb9ae','#fff'],40,420,1.1,0,200);
  for(let i=0;i<5;i++)later(.12*i,()=>{burst(b.x+rand(0,b.w),b.y+rand(0,b.h),['#ffb040','#ffe08a','#8a8a8a'],12,300,.7,0,200);shake(8)});
  shake(12);vib([40,40,80,40,120]);SFX.bossDie();dropCap(b.x+b.w/2,b.y+b.h/2,'gem');
  G.haz=[];
  for(const k of G.bricks)if(!k.dead&&!k.isBoss&&!k.wall){k.dead=true;G.alive--;burst(k.x+k.w/2,k.y+k.h/2,BCOL[k.k]||BCOL.clay,4,150,.5)}
  G.bossDown=true;G.winT=2.6;
}

function launch(){

  if(any){if(G.mode==='ready'){G.mode='play'}SFX.click();updLaunchBtn()}

function updLaunchBtn(){$('bLaunch').style.display=(G.mode==='ready'&&G.balls.some(b=>b.stuck))?'block':'none'}
function loseBall(){
  if(G.balls.length>0)return;
  G.lives--;SFX.lose();vib([60,40,60]);shake(5);
  if(G.lives<=0){gameOver();return}
  resetEff();G.caps=[];G.shots=[];G.haz=[];P.stun=0;
  const b=newBall(P.x,P.y-P.h/2-6,0,0);b.stuck=true;G.balls=[b];G.mode='ready';
  store.save={level:G.level,score:G.lvStartScore,lives:G.lives};persist();updLaunchBtn();toast('جان باقی‌مانده: '+fa(G.lives),1400);
}
function stepBalls(dt){
  const sp0=curSpeed();
  for(const b of G.balls){
    b.r=G.eff.mega>0?10:6;
    if(b.stuck){b.x=clamp(P.x+b.off,WL+8,WR-8);b.y=P.y-P.h/2-b.r;continue}
    let sp=Math.hypot(b.vx,b.vy)||1;if(Math.abs(sp-sp0)>2){const k=1+(sp0/sp-1)*Math.min(1,dt*6);b.vx*=k;b.vy*=k;sp=Math.hypot(b.vx,b.vy)}
    const steps=Math.max(1,Math.ceil(sp*dt/4)),sd=dt/steps;
    for(let i=0;i<steps&&!b.dead;i++){
      b.x+=b.vx*sd;b.y+=b.vy*sd;
      if(b.x<WL+b.r){b.x=WL+b.r;b.vx=Math.abs(b.vx);SFX.wall()}else if(b.x>WR-b.r){b.x=WR-b.r;b.vx=-Math.abs(b.vx);SFX.wall()}

function winLevel(){

  store.maxLevel=Math.max(store.maxLevel,Math.min(MAXL,G.level+1));

  $('wTitle').textContent=G.boss?'باس شکست خورد! 👑':'مرحله '+fa(G.level)+' کامل شد!';
  $('wInfo').innerHTML='امتیاز: <b>'+fa(G.score)+'</b><br>پاداش جان‌ها: +'+fa(bonus)+'<br>'+(G.level<MAXL?'مرحله بعد: '+fa(G.level+1):'آخرین مرحله!');

}

    if(st<.75){g.strokeStyle='rgba(30,15,5,.7)';g.lineWidth=1.5;g.beginPath();g.moveTo(x+w*.1,y);g.lineTo(x+w*.16,y+h*.5);g.lineTo(x+w*.1,y+h);if(st<.45){g.moveTo(x+w*.85,y);g.lineTo(x+w*.78,y+h*.4);g.lineTo(x+w*.88,y+h)}g.stroke()}
  }else{
    const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'#bfe9f6');gr.addColorStop(.5,'#6aa6cf');gr.addColorStop(1,'#3e6f9a');
    g.fillStyle='#8cbad0';g.beginPath();g.moveTo(x-26,y+10);g.lineTo(x+10,y+h*.35);g.lineTo(x+10,y+h*.8);g.closePath();g.fill();g.beginPath();g.moveTo(x+w+26,y+10);g.lineTo(x+w-10,y+h*.35);g.lineTo(x+w-10,y+h*.8);g.closePath();g.fill();
    g.fillStyle=gr;g.beginPath();g.moveTo(x+12,y);g.lineTo(x+w-12,y);g.lineTo(x+w,y+h*.45);g.lineTo(x+w*.82,y+h);g.lineTo(x+w*.18,y+h);g.lineTo(x,y+h*.45);g.closePath();g.fill();
    g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.moveTo(x+14,y+3);g.lineTo(x+w*.5,y+3);g.lineTo(x+w*.3,y+h*.45);g.lineTo(x+6,y+h*.4);g.fill();
    g.fillStyle=ph2?'#e8602a':'#ffe08a';g.beginPath();g.moveTo(x+w*.25,y+h*.3);g.lineTo(x+w*.4,y+h*.38);g.lineTo(x+w*.27,y+h*.5);g.fill();g.beginPath();g.moveTo(x+w*.75,y+h*.3);g.lineTo(x+w*.6,y+h*.38);g.lineTo(x+w*.73,y+h*.5);g.fill();
    g.fillStyle='#fff';for(let i=0;i<5;i++){g.beginPath();g.moveTo(x+w*.34+i*w*.08,y+h*.78);g.lineTo(x+w*.38+i*w*.08,y+h*.9);g.lineTo(x+w*.42+i*w*.08,y+h*.78);g.fill()}
    g.fillStyle='#e0f6ff';g.beginPath();g.moveTo(x+w*.5,y-12);g.lineTo(x+w*.55,y+2);g.lineTo(x+w*.45,y+2);g.fill();
  }
  if(bt>2){g.fillStyle={3:'rgba(90,200,255,.38)',4:'rgba(255,90,40,.42)',5:'rgba(40,10,70,.55)'}[bt];rr(g,x+6,y+6,w-12,h-12,10);g.fill();if(bt===5){g.font='22px '+FONT;g.textAlign='center';g.fillStyle='#fff';g.fillText('👑',x+w/2,y-8)}}
  if(B.boss>5){g.strokeStyle='#ffd870';g.lineWidth=3;rr(g,x,y,w,h,12);g.stroke()}
  if(hit){g.globalAlpha=.55;g.fillStyle='#fff';rr(g,x,y,w,h,10);g.fill();g.globalAlpha=1}
}
let hudCache={};
function drawHUD(g){
  g.fillStyle='rgba(40,24,12,.8)';g.fillRect(0,0,W,TOP-2);g.fillStyle='#e0a850';g.fillRect(0,TOP-3,W,2);
  g.textBaseline='middle';
  g.textAlign='right';g.fillStyle='#ffd9a0';g.font='12px '+FONT;g.fillText('امتیاز',W-12,14);
  g.fillStyle='#fff4dc';g.font='bold 22px '+FONT;
  if(hudCache.s!==G.score){hudCache.s=G.score;hudCache.st=fa(G.score)}g.fillText(hudCache.st,W-12,38);
  g.textAlign='center';g.fillStyle='#ffe2a8';g.font='bold 14px '+FONT;
  if(hudCache.l!==G.level){hudCache.l=G.level;hudCache.lt='مرحله '+fa(G.level)+' / ۱۰۰'}g.fillText(hudCache.lt,W/2+14,14);
  g.fillStyle='#d9c4a0';g.font='11px '+FONT;
  if(hudCache.b!==store.best){hudCache.b=store.best;hudCache.bt='رکورد: '+fa(store.best)}g.fillText(hudCache.bt,W/2+14,32);
  g.textAlign='left';g.font='15px '+FONT;g.fillStyle='#ff7b7b';
  g.fillText('♥'.repeat(Math.min(G.lives,7)),12,52);
  /* نوار باس */
  const B=G.boss;
  if(B&&!B.dead){const bw=210,bx=W/2-bw/2+14,by=44;g.fillStyle='rgba(20,10,5,.7)';rr(g,bx-2,by-2,bw+4,10,5);g.fill();const f=Math.max(0,B.hp/B.max);const hg=g.createLinearGradient(bx,0,bx+bw,0);hg.addColorStop(0,'#e8602a');hg.addColorStop(1,'#ffb040');g.fillStyle=hg;rr(g,bx,by,bw*f,6,3);g.fill();g.fillStyle='#fff4dc';g.font='bold 10px '+FONT;g.textAlign='center';g.fillText(B.name,bx+bw/2,by-9)}
  /* چیپ‌های جایزه */
  const e=G.eff,items=[['fire','🔥'],['wide','↔️'],['small','🔻'],['shield','🛡️'],['slow','🐢'],['fast','🚀'],['laser','🎯'],['magnet','🧲'],['mult','×۲'],['mega','🌑'],['freeze','❄️'],['lucky','🍀'],['power','⚔️'],['bomb','💣'],['rev','🌀']].filter(a=>e[a[0]]>0);
  if(items.length){const cw=Math.min(44,(W-16)/items.length),tw=items.length*cw,x0=W/2-tw/2;g.textAlign='center';g.font='11px '+FONT;
    items.forEach((a,i)=>{const x=x0+i*cw,t=e[a[0]],mx=DUR[a[0]];g.fillStyle='rgba(40,24,12,.78)';rr(g,x+1,TOP+3,cw-3,19,9);g.fill();g.fillStyle=PW[a[0]].c;rr(g,x+3,TOP+17,(cw-7)*clamp(t/mx,0,1),3,1.5);g.fill();g.fillStyle='#fff4dc';g.fillText(a[1]+fa(Math.ceil(t)),x+cw/2-1,TOP+11)});
    if(e.laser>0){g.fillStyle='#ffe2a8';g.font='10px '+FONT;g.fillText('تیر: '+fa(G.laserLeft),W/2,TOP+30)}}
  if(G.mode==='ready'&&G.balls.some(b=>b.stuck)){g.fillStyle='rgba(40,24,12,.7)';g.textAlign='center';g.font='bold 13px '+FONT;g.fillText('لمس کن یا Space بزن تا توپ پرتاب بشه',W/2,H-100)}
}

/* ================= رابط کاربری ================= */
const SCR=['sMenu','sLevels','sRec','sHelp','sSet','sPause','sWin','sOver'];
let backTo='sMenu';
function hideAll(){SCR.forEach(i=>$(i).classList.remove('on'))}
function show(id){hideAll();$('toast').style.display='none';$(id).classList.add('on');if(id==='sMenu')refreshMenu()}
function showHudBtns(v){$('bPause').style.display=v?'flex':'none';$('bFs').style.display=v?'flex':'none'}
function refreshMenu(){
  const c=$('mCont');c.classList.toggle('off',!store.save);c.textContent=store.save?'⏩ ادامه بازی (مرحله '+fa(store.save.level)+')':'⏩ ادامه بازی';
  $('mHome').style.display=EMB?'':'none';$('pHome').style.display=EMB?'':'none';$('oHome').style.display=EMB?'':'none';
}
function toMenu(){
  if(G.mode==='play'||G.mode==='ready'||G.mode==='pause'){store.save={level:G.level,score:G.lvStartScore,lives:G.lives};persist()}
  G.mode='menu';buildBricks(3);G.balls=[];G.caps=[];G.haz=[];G.shots=[];parts=[];G.level=3;resetEff();makeBg();showHudBtns(false);updLaunchBtn();show('sMenu');
}
function openSub(id){backTo=G.mode==='pause'?'sPause':'sMenu';show(id)}
function buildLevels(){
  const gr=$('lvGrid');gr.textContent='';$('lvInfo').textContent='مرحله‌های بازشده: '+fa(store.maxLevel)+' از ۱۰۰';
  for(let i=1;i<=MAXL;i++){const b=document.createElement('button'),lock=i>store.maxLevel;b.className='lv'+(lock?' lock':'')+(i%10===0?' boss':'');b.innerHTML=fa(i)+'<small>'+(lock?'🔒':i%10===0?'👑':'')+'</small>';b.onclick=()=>{SFX.click();enterFs();newRun(i)};gr.appendChild(b)}
}
function buildRec(){
  $('recBox').innerHTML='بالاترین امتیاز: <b>'+fa(store.best)+'</b><br>بالاترین مرحله بازشده: <b>'+fa(store.maxLevel)+'</b> از ۱۰۰<br>'+(store.save?'بازی ذخیره‌شده: مرحله <b>'+fa(store.save.level)+'</b> با امتیاز <b>'+fa(store.save.score)+'</b>':'بازی ذخیره‌شده‌ای نداری');
}
function buildHelp(){
  const rows=[['🧱','معمولی (۱ ضربه)',500],['🪨','سنگی (۲ ضربه)',1000],['🔩','فلزی (۳ ضربه)',1500],['🥇','طلایی (۴ ضربه)',2000],['🔷','شیشه‌ای (۱ ضربه)',500],['🧊','یخی (۲ ضربه)',1000],['🪵','چوبی متحرک (۲ ضربه)',1000],['💣','انفجاری؛ اطرافش رو می‌ترکونه',500],['🎁','جایزه‌دار؛ چند جایزه می‌ندازه',1000],['❔','ناشناخته؛ همیشه جایزه می‌ده',500],['🛡️','محافظ‌دار؛ اول لایه دفاعی',1500],['⬛','ابسیدین؛ خیلی محکم (۵ ضربه)',2500],['⚡','الکتریکی؛ وقتی می‌شکنه صاعقه می‌زنه',1000],['🌋','آتشفشانی؛ وقتی می‌شکنه آتش به سمت صفحه میاد',1000],['⚙️','فلزی متحرک (۳ ضربه)',1500]];
  let h='<b>کنترل:</b> انگشتت رو روی صفحه بکش تا صفحه حرکت کنه؛ لمس کوتاه یا Space = پرتاب. کیبورد: ← → یا A و D، Esc = مکث.<br><b>امتیاز:</b> هر آجر فقط یک‌بار و موقع نابودی کامل امتیاز می‌ده: ۵۰۰ × سختی.<br><br><div class="legend">';
  rows.forEach(r=>{h+='<b>'+r[0]+'</b><span>'+r[1]+' — '+fa(r[2])+'</span>'});
  h+='<b>⏬</b><span>از مرحله ۲۶ به بعد آجرها آروم آروم پایین میان</span>';h+='<b>👑</b><span>باس هر ۱۰ مرحله (۱۰ تا ۱۰۰؛ از ۶۰ به بعد قوی‌تر) — گلوله‌هاش صفحه رو گیج می‌کنه</span></div><br><b>جایزه‌ها:</b><div class="legend">';
  Object.keys(PW).forEach(k=>{const d=PW[k];h+='<b>'+d.ic+'</b><span>'+d.n+(d.bad?' (منفی)':'')+'</span>'});
  $('helpBox').innerHTML=h+'</div>';
}
function syncSettings(){
  [['tSound','sound'],['tMusic','music'],['tVib','vib'],['tShake','shake']].forEach(a=>$(a[0]).classList.toggle('on',!!store.set[a[1]]));
  document.querySelectorAll('#qSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.q===store.set.q));
  $('pSound').textContent=store.set.sound?'🔊 صدا':'🔇 صدا';$('pMusic').textContent=store.set.music?'🎵 موسیقی':'🔕 موسیقی';
}
function fs(){
  const d=document,el=d.documentElement,on=d.fullscreenElement||d.webkitFullscreenElement;
  try{
    if(on){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}
    const rq=el.requestFullscreen||el.webkitRequestFullscreen;
    if(rq){const p=rq.call(el);if(p&&p.catch)p.catch(()=>fsFallback())}else fsFallback();
  }catch(e){fsFallback()}
}
function fsFallback(){
  try{const pd=window.parent.document,pe=pd.documentElement,rq=pe.requestFullscreen||pe.webkitRequestFullscreen;if(window.parent!==window&&rq){const p=rq.call(pe);if(p&&p.catch)p.catch(()=>toast('مرورگر اجازه‌ی تمام‌صفحه نداد'));return}}catch(e){}
  toast('مرورگر اجازه‌ی تمام‌صفحه نداد؛ بازی عادی ادامه داره');
}
function parentFs(){try{if(window.parent!==window){const pe=window.parent.document.documentElement,rq=pe.requestFullscreen||pe.webkitRequestFullscreen;if(rq){const p=rq.call(pe);if(p&&p.catch)p.catch(()=>{})}}}catch(e){}}
function enterFs(){
  const d=document,el=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement)return;
  try{const rq=el.requestFullscreen||el.webkitRequestFullscreen;if(rq){const p=rq.call(el);if(p&&p.catch)p.catch(parentFs)}else parentFs()}catch(e){parentFs()}
}
['fullscreenchange','webkitfullscreenchange'].forEach(e=>document.addEventListener(e,()=>setTimeout(resize,120)));
function pause(){
  if(G.mode!=='play'&&G.mode!=='ready')return;G.prevMode=G.mode;G.mode='pause';show('sPause');showHudBtns(false);$('bLaunch').style.display='none';syncSettings();
}
function resume(){if(G.mode!=='pause')return;G.mode=G.prevMode||'play';hideAll();showHudBtns(true);updLaunchBtn();lastT=performance.now()}

/* ورودی */
let drag=null;
function lx(e){const r=cv.getBoundingClientRect();return(e.clientX-r.left)/r.width*W}
cv.addEventListener('pointerdown',e=>{
  audioInit();if(G.mode!=='play'&&G.mode!=='ready')return;e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  drag={id:e.pointerId,sx:lx(e),px:P.tx,t:performance.now(),moved:0,type:e.pointerType};
});
cv.addEventListener('pointermove',e=>{
  if(G.mode!=='play'&&G.mode!=='ready')return;
  if(e.pointerType==='mouse'&&!drag){P.tx=G.eff.rev>0?W-lx(e):lx(e);return}
  if(!drag||drag.id!==e.pointerId)return;e.preventDefault();
  const x=lx(e);drag.moved=Math.max(drag.moved,Math.abs(x-drag.sx));P.tx=drag.type==='mouse'?(G.eff.rev>0?W-x:x):drag.px+(x-drag.sx)*1.15*(G.eff.rev>0?-1:1);
});
function endDrag(e){
  if(!drag||drag.id!==e.pointerId)return;
  if(drag.moved<10&&performance.now()-drag.t<350&&G.mode==='ready')launch();
  else if(drag.type==='mouse'&&drag.moved<6&&G.mode==='ready')launch();
  drag=null;
}
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{
  audioInit();const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.l=true;else if(k==='ArrowRight'||k==='d'||k==='D')keys.r=true;
  else if(k===' '||k==='Enter'){if(G.mode==='ready'){e.preventDefault();launch()}}
  else if(k==='Escape'||k==='p'||k==='P'){if(G.mode==='pause')resume();else pause()}
});
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')keys.l=false;else if(k==='ArrowRight'||k==='d'||k==='D')keys.r=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();if(AC&&AC.state==='running')AC.suspend().catch(()=>{})}else if(AC&&AC.state==='suspended')AC.resume().catch(()=>{})});
addEventListener('resize',()=>setTimeout(resize,50));addEventListener('orientationchange',()=>setTimeout(resize,200));
addEventListener('contextmenu',e=>e.preventDefault());

/* دکمه‌ها */
const click=(id,fn)=>$(id).addEventListener('click',()=>{try{audioInit();SFX.click()}catch(e){}fn()});
click('mStart',()=>{enterFs();newRun(1)});
click('mCont',()=>{enterFs();continueRun()});
click('mLevels',()=>{buildLevels();openSub('sLevels')});
click('mRec',()=>{buildRec();openSub('sRec')});
click('mHelp',()=>{buildHelp();openSub('sHelp')});
click('mSet',()=>{syncSettings();openSub('sSet')});
click('mFs',fs);click('sFs',fs);click('pFs',fs);click('bFs',fs);
const goArcade=()=>{if(runPosted)postScore(true);post('home',0)};
click('mHome',goArcade);click('pHome',goArcade);click('oHome',goArcade);
document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>{SFX.click();show(backTo)}));
click('recReset',()=>{if(!window.confirm('رکورد و مرحله‌های بازشده پاک بشن؟'))return;store.best=0;store.maxLevel=1;store.save=null;persist();hudCache={};buildRec();refreshMenu()});
[['tSound','sound'],['tMusic','music'],['tVib','vib'],['tShake','shake']].forEach(a=>$(a[0]).addEventListener('click',()=>{audioInit();store.set[a[1]]=!store.set[a[1]];persist();syncSettings();SFX.click();if(a[1]==='vib'&&store.set.vib)vib(30)}));
document.querySelectorAll('#qSeg button').forEach(b=>b.addEventListener('click',()=>{store.set.q=+b.dataset.q;persist();syncSettings();resize();SFX.click()}));
$('pSound').addEventListener('click',()=>{store.set.sound=!store.set.sound;persist();syncSettings()});
$('pMusic').addEventListener('click',()=>{store.set.music=!store.set.music;persist();syncSettings()});
click('bPause',pause);click('pResume',resume);
click('pRestart',()=>{G.score=G.lvStartScore;G.mode='x';startLevel(G.level)});
click('pMenu',toMenu);
click('wNext',()=>{if(G.mode==='win'){G.mode='x';nextLevel()}});
click('oAgain',()=>{if(G.mode==='over'&&G.level>=1&&G.level<MAXL+1&&G.lives<=0){audioInit();musStart();G.lives=3;G.score=G.lvStartScore||0;runPosted=false;startLevel(G.level)}else newRun(1)});click('oMenu',toMenu);
$('bLaunch').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audioInit();launch()});

/* ================= حلقه ================= */
let lastT=performance.now(),acc=0,avg=.0167,perfT=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-lastT)/1000;lastT=now;if(dt>.1)dt=.1;if(dt<=0)return;
  avg+=(dt-avg)*.05;perfT+=dt;
  if(perfT>2){perfT=0;if(avg>.034&&G.perf>.35){G.perf=Math.max(.35,G.perf*.75);resize()}else if(avg<.019&&G.perf<1){G.perf=Math.min(1,G.perf*1.15)}}
  if(G.mode!=='pause'&&G.mode!=='over'){acc+=dt;let n=0;while(acc>=1/60&&n<4){update(1/60);acc-=1/60;n++}if(n===4)acc=0}
  if(G.mode==='menu'){G.t+=0}
  render();
  if(pendPost&&performance.now()-lastPost>300)postScore(true);
}
function init(){
  resize();buildBricks(3);G.level=3;makeBg();show('sMenu');syncSettings();refreshMenu();
  requestAnimationFrame(t=>{lastT=t;frame(t)});
  setInterval(()=>{if(G.mode==='menu')for(const k of G.bricks)if(k.mv)k.x=k.mv.base+Math.sin(performance.now()/1000*k.mv.sp)*k.mv.range},50);
}
window.__BO={G,P,store,update,startLevel,newRun,launch,hitBrick,killBrick,givePower,BT,LV,PW,BOSS,resize,setQ:q=>{store.set.q=q;resize()},render,pause,resume,show,SFX};
init();
</script>
