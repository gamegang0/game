#toast.on{opacity:1}
#rap{position:fixed;inset:0;display:none;pointer-events:none;z-index:5;overflow:hidden}
#rap.on{display:block;animation:fi .35s}
#rap.out{animation:fo .4s forwards}
#rc{position:absolute;inset:0;width:100%;height:100%}

function env(g,t,a,d,v){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}

function netShot(p,vx,vy){netSend({t:'shot',e:epoch,tm:myTeam,i:obj.indexOf(p),vx,vy},1)}
function flushShots(){while(pendShot.length){const m=pendShot[0];if(m.e<epoch){pendShot.shift();continue}
 if(m.e===epoch&&state==='aim'&&turn===m.tm&&m.tm!==myTeam){pendShot.shift();const p=obj[m.i];if(p&&p.t===m.tm&&isFinite(m.vx)&&isFinite(m.vy)){const l=Math.sqrt(m.vx*m.vx+m.vy*m.vy);if(l>19.01){m.vx*=19/l;m.vy*=19/l}shoot(p,m.vx,m.vy)}}else break}}
function sendAim(){const n=performance.now();if(n-lastAim<45||!sel||!sp||!aim)return;lastAim=n;netSend({t:'aim',i:obj.indexOf(sel),sx:sp.x,sy:sp.y,x:aim.x,y:aim.y},0)}
function onAim(m){if(state!=='aim'||turn===myTeam)return;if(m.i<0){sel=aim=sp=null;return}const p=obj[m.i];if(p&&p.t===turn){sel=p;sp={x:m.sx,y:m.sy};aim={x:m.x,y:m.y}}}
function sendSnap(){netSend({t:'snap',e:epoch,s:score,tn:turn,rs:prng,o:obj.map(o=>[o.x,o.y])},1)}
function trySnap(){const q=snapQ;if(!q)return;if(q.e===epoch&&state==='aim'){applySnap(q);snapQ=null}else if(q.e<epoch||(q.e===epoch&&state!=='aim'))snapQ=null}
function applySnap(q){obj.forEach((o,i)=>{const p=q.o[i];if(p){o.x=p[0];o.y=p[1];o.vx=o.vy=0}});score=q.s.slice();turn=q.tn;prng=q.rs;updHud()}
function aimEnter(){epoch++;if(mode!=='online')return;if(role==='host')sendSnap();trySnap();flushShots();updHud()}
function netTick(){if(!mq||!mq.connected)return;const n=Date.now();
 if(n-lastPing>2000){lastPing=n;netSend({t:'p',ts:n},0);if(mode==='online')updHud()}
 if(snapQ&&state==='aim'&&snapQ.e>epoch&&n-snapQ.at>4000){epoch=snapQ.e;applySnap(snapQ);snapQ=null}
 if(matchLive&&!settled&&((oppGone&&n-oppGone>22000)||(lastRx&&n-lastRx>30000))){netSend({t:'res',w:myTeam,why:'dc'});endMatch(myTeam,'dc')}}
setInterval(netTick,1000);
/* ---- end / rematch / leave ---- */
function finishOnline(){recd=true;state='over';const w=score[0]>score[1]?0:1;
 if(role==='host'){netSend({t:'end',w,s:score});endMatch(w)}
 else if(endW!==null)endMatch(endW);else setTimeout(()=>{if(!settled)endMatch(w)},6000)}
function endMatch(w,why){if(settled)return;settled=true;matchLive=false;SV.pend=0;const won=w===myTeam;let gain=0;if(STAKE&&won){gain=STAKE*2;SV.coins+=gain}save();state='over';updHud();sfx(won?'win':'conc');
 const title=why==='bye'?'🏃 حریف رفت؛ تو بردی! 🏆':why==='dc'?(won?'📡 حریف قطع شد؛ تو بردی! 🏆':'📡 باختی (قطع ارتباط)'):(won?'بردی! 🏆':'باختی 😅');
 ov.innerHTML=`<h2>${title}</h2><div class="cn">${FA(score[myTeam])} - ${FA(score[1-myTeam])}</div>${STAKE?`<div class="cn">${won?'جایزه':'باختی'}: <b>${won?'+'+FA(gain):'-'+FA(STAKE)}</b> 🪙</div>`:''}<div class="cn">🪙 <b>${FA(SV.coins)}</b></div><button id="rmb" onclick="reqRematch()">🔁 دوباره</button><button class="b3" onclick="leaveOnline()">منو</button>`;ov.style.display='flex'}
function reqRematch(){if(STAKE&&SV.coins<STAKE)return toast('سکه‌ات برای شرط کافی نیست 🪙');rmMine=true;netSend({t:'rm'});$('rmb').textContent='⏳ منتظر حریف...';tryRematch()}
function tryRematch(){if(role==='host'&&rmMine&&rmOpp&&settled&&!matchLive)hostBegin()}
function leaveOnline(){if(matchLive&&!settled)netSend({t:'bye'});netClose();matchLive=false;settled=true;hostInfo=null;oppId='';NETFIX=false;mode='bot';recd=true;pendShot=[];snapQ=null;rmMine=rmOpp=false;sel=aim=sp=null;state='menu';setWorld();fit();showMenu()}
function exitGame(){if(mode!=='online'){post('home',0);return}
 if(matchLive&&!settled){if(!confirm('اگه الان بری بازی رو می‌بازی'+(STAKE?' و شرط ('+FA(STAKE)+' سکه) سوخت می‌شه':'')+'. مطمئنی؟'))return;netSend({t:'bye'})}
 netClose();matchLive=false;settled=true;if(emb){setTimeout(()=>post('home',0),220);return}leaveOnline()}
const _uh=updHud;updHud=function(){_uh();if(mode==='online'){$('pb').hidden=true;$('hb').hidden=false;if(['aim','moving','goal','nogoal'].includes(state)){const t=$('tr');t.className=turn===myTeam?'t0':'t1';t.textContent=(turn===myTeam?'🎯 نوبت توست':'⏳ نوبت '+oppName)+(STAKE?' · 🪙 '+FA(STAKE*2):'')+(rtt?' · '+FA(rtt)+'ms'+(dcOpen()?' ⚡':''):'')}}};

setWorld();if(!pitch)buildPitch();fit();emb?showMenu():showCover();
(function loop(){update();draw();rapAnim();requestAnimationFrame(loop)})();
</script></body></html>
