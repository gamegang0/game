<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>مارخور</title>
<style>
html,body{height:100%;margin:0;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;top:0;left:0;display:block}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;color:#fff}
.card{pointer-events:auto;background:rgba(23,21,38,.92);border-radius:18px;padding:22px 20px;width:min(92vw,360px);max-height:86vh;overflow:auto;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5);box-sizing:border-box}
.card[hidden]{display:none}
h1{margin:0 0 8px;font-size:46px}
.sub{font-size:15px;line-height:1.9;color:rgba(255,255,255,.85);margin-bottom:8px}
.wal{font-size:17px;color:#ffd166;font-weight:700;margin:6px 0 14px}
button{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:12px;padding:12px 18px;margin:4px;cursor:pointer;background:#ffd166;color:#2a1d00}
button.sec{background:rgba(255,255,255,.14);color:#fff}
button:disabled{opacity:.4;cursor:default}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.sk{background:rgba(255,255,255,.07);border-radius:12px;padding:8px;border:2px solid transparent}
.sk.on{border-color:#7ae7c7}
.sk canvas{width:100%;height:44px;display:block}
.sk b{display:block;font-size:15px;margin-top:4px}
.sk i{display:block;font-style:normal;font-size:12px;margin-bottom:6px}
.sk button{width:100%;font-size:14px;padding:8px;margin:0}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#05030c;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;text-align:center;padding:24px}
#rot .ph{font-size:76px;animation:rt 2.2s ease-in-out infinite}
#rot b{font-size:24px}#rot small{font-size:14px;opacity:.7}
@keyframes rt{0%,25%{transform:rotate(90deg)}65%,100%{transform:rotate(0)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rot"><div class="ph">📱</div><b>گوشی رو عمودی بگیر</b><small>این بازی فقط توی حالت عمودی (پرتره) اجرا میشه</small></div>
<div id="ui">
<div class="card" id="main"><h1 id="ttl">مارخور</h1><div class="sub" id="sub"></div><div class="wal" id="wal"></div><button id="play">شروع بازی</button><button id="skbtn" class="sec">اسکین‌ها</button><button id="home" class="sec">🏠 منوی اصلی</button></div>

<div class="card" id="shop" hidden><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:20px">اسکین‌ها</b><span class="wal" id="wal2" style="margin:0"></span></div><div id="grid"></div><button id="back" class="sec" style="width:100%">برگشت</button></div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const FONT='Vazirmatn,Tahoma,"Segoe UI",sans-serif',TAU=Math.PI*2,R=2600,BOTS=14,FOODMAX=950;
const NAMES=['کاوه','نیما','سارا','آرش','مهسا','پویا','رها','بابک','ستاره','کیان','نگار','سام','لیلا','داریوش'];
let W,H,offX=0,DPRv=1;
function rs(){
  const D=Math.min(devicePixelRatio||1,2),iw=innerWidth,ih=innerHeight,coarse=matchMedia('(pointer:coarse)').matches;
  DPRv=D;
  // موبایل/تبلت: کل صفحه. دسکتاپ: ستون عمودی ۹:۱۶ وسط صفحه
  W=coarse?iw:Math.round(Math.min(iw,ih*.5625));H=ih;offX=Math.round((iw-W)/2);
  c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';c.style.left=offX+'px';
  x.setTransform(D,0,0,D,0,0);
  const u=document.getElementById('ui');if(u){u.style.left=offX+'px';u.style.right='auto';u.style.width=W+'px'}
}
addEventListener('resize',rs);addEventListener('orientationchange',()=>setTimeout(rs,120));rs();
const nrm=a=>((a+Math.PI)%TAU+TAU)%TAU-Math.PI;
const rnd=Math.random;
const $=id=>document.getElementById(id);
const RAR={c:{n:'رایج',col:'#b8c0cc',w:5},r:{n:'کمیاب',col:'#4da3ff',w:3},e:{n:'حماسی',col:'#b86bff',w:2},l:{n:'افسانه‌ای',col:'#ffb02e',w:1},m:{n:'اسطوره‌ای',col:'#ff4d6d',w:.6}};
const hs=(h,s,l)=>'hsl('+h+','+s+'%,'+l+'%)';
const SKINS=[
{id:'teal',n:'نعنا',r:'c',p:0,h:165,col:i=>hs(165,70,46+(Math.floor(i/3)%2)*7)},
{id:'ember',n:'اخگر',r:'c',p:80,h:18,col:i=>hs(18,80,48+(Math.floor(i/3)%2)*7)},
{id:'violet',n:'شب‌بو',r:'c',p:80,h:270,col:i=>hs(270,60,52+(Math.floor(i/3)%2)*7)},
{id:'zebra',n:'گورخر',r:'r',p:300,h:0,col:i=>Math.floor(i/3)%2?hs(0,0,92):hs(0,0,14)},
{id:'candy',n:'آبنبات',r:'r',p:300,h:330,col:i=>Math.floor(i/3)%2?hs(330,85,70):hs(190,80,75)},
{id:'lava',n:'گدازه',r:'e',p:900,h:20,col:(i,n,t)=>hs(Math.floor((Math.sin(i*.25-t*4)+1)*25),95,48+Math.sin(i*.25-t*4)*10)},
{id:'aurora',n:'شفق',r:'e',p:900,h:150,col:(i,n,t)=>hs((130+i*4+Math.sin(t*2)*30)%360,80,55)},
{id:'gold',n:'زرین',r:'l',p:2500,h:45,aura:1,col:(i,n,t)=>hs(45,95,40+Math.max(0,Math.sin(i*.3-t*5))*28)},
{id:'rainbow',n:'رنگین‌کمان',r:'l',p:3000,h:300,aura:1,col:(i,n,t)=>hs((i*7+t*90)%360,90,58)},
{id:'galaxy',n:'کهکشان',r:'m',p:6000,h:260,aura:1,col:(i,n,t)=>(i*37+Math.floor(t*5))%9===0?hs(0,0,95):hs(250+(i*3)%40,70,22+(Math.floor(i/2)%2)*6)},
{id:'phoenix',n:'ققنوس',r:'m',p:8000,h:25,aura:1,col:(i,n,t)=>{const w=Math.sin(i*.35-t*9);return hs(Math.max(0,Math.floor((w*.5+.5)*55)),100,45+w*12)}}
];
const skinById=id=>SKINS.find(k=>k.id===id)||SKINS[0];
function botSkin(){let tot=0;for(const k of SKINS)tot+=RAR[k.r].w;let r=rnd()*tot;for(const k of SKINS){r-=RAR[k.r].w;if(r<=0)return k}return SKINS[0]}
let save={wallet:100,owned:['teal'],sel:'teal'};
try{const q=JSON.parse(localStorage.getItem('markhor-save'));if(q&&Array.isArray(q.owned)&&typeof q.wallet==='number')save=q}catch(e){}
if(!save.owned.includes('teal'))save.owned.push('teal');
if(!save.owned.includes(save.sel))save.sel='teal';
function sv(){try{localStorage.setItem('markhor-save',JSON.stringify(save))}catch(e){}}

let st='ready',t=0,overAt=0,earned=0,uiShown=false,best=0,parts=[],rings=[],bolts=[],pops=[],chain=[],eyes=[],rifts=[],motes=[],lines=[],punch=0,aber=0,glitch=0,rage=0,streak=0,streakT=-99,hitStop=0,ts=1,fxQ=1,bK=0,dang=0,zz=.7,gAvg=.016,paused=false,lastEmit=0,snakes=[],food=[],P=null,cam={x:0,y:0,z:.7},lb=[],lbT=0,msg={s:'',t:0};
let ptr={x:0,y:0},steerId=null,boostId=null,boostIn=false;
try{best=+localStorage.getItem('markhor-best')||0}catch(e){}
const btn=()=>({x:W-70,y:H-90,r:44});
const pbtn=()=>({x:W/2,y:H-40,r:20});

function upR(s){s.r=7+Math.min(18,Math.sqrt(s.mass)*.55);s.sp=s.r*.7}
function addFood(px,py,v,h){food.push({x:px,y:py,v,h,ph:rnd()*6})}
function safePos(){
  for(let k=0;k<40;k++){
    const a=rnd()*TAU,d=R*.8*Math.sqrt(rnd()),px=Math.cos(a)*d,py=Math.sin(a)*d;let ok=true;
    for(const s of snakes){if(!s.alive)continue;for(let i=0;i<s.segs.length;i+=4){if(Math.hypot(s.segs[i].x-px,s.segs[i].y-py)<350){ok=false;break}}if(!ok)break}
    if(ok)return[px,py];
  }
  return[0,0];
}
function mk(name,isP,mass){
  const[px,py]=safePos(),a=rnd()*TAU;
  const s={name,isP,x:px,y:py,ang:a,ta:a,mass:mass||10,hue:0,skin:null,sa:a,segs:[],boost:false,alive:true,kills:0,think:rnd()*.1,aggr:.3+rnd()*.6,wander:a,drop:0,dead:0,hunt:false,glow:0,bk:0,fe:0};
  upR(s);s.skin=isP?skinById(save.sel):botSkin();s.hue=s.skin.h;
  for(let i=0;i<10;i++)s.segs.push({x:px-Math.cos(a)*i*s.sp,y:py-Math.sin(a)*i*s.sp});
  return s;
}
function init(){
  snakes=[];food=[];
  for(let i=0;i<700;i++){const a=rnd()*TAU,d=R*Math.sqrt(rnd());addFood(Math.cos(a)*d,Math.sin(a)*d,.6+rnd()*.9,Math.floor(rnd()*360))}
  P=mk('تو',true,10);P.alive=false;snakes.push(P);
  for(let i=0;i<BOTS;i++)snakes.push(mk(NAMES[i],false,10+rnd()*40));
  initFX();
}
function start(){
  Object.assign(P,mk('تو',true,10));P.quit=false;st='play';SND.start();msg={s:'',t:0};uiShown=false;paused=false;$('pz').hidden=true;parts=[];rings=[];bolts=[];pops=[];chain=[];punch=0;aber=0;glitch=0;rage=0;streak=0;streakT=-99;hitStop=0;ts=1;bK=0;lastEmit=0;$('ui').style.display='none';emit('start',0);joy.id=null;joy.on=false;joy.ang=P.ang;boostIn=false;boostId=null;
}
init();

function emit(type,score,won){try{if(parent!==window)parent.postMessage({source:'nova-arcade-embed',game:'markhor',type,score:Math.max(0,Math.floor(score||0)),won:!!won},'*')}catch(e){}}

/* ================= SOUND ENGINE (WebAudio, procedural, no files) ================= */
const SND=(()=>{
let ac,mst,muff,rv,bus,N={},L={},on=true,chk=0,vc=0,lastHiss=0,lastEat=0,lastEatT=0,eatC=0,hb=0,mile=0,wasB=false,lastBot=0;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),RN=(a,b)=>a+Math.random()*(b-a),SC=[0,3,5,7,10,12,15,17],RI={c:0,r:1,e:2,l:3,m:4};
const nt=(b,s)=>b*Math.pow(2,s/12);
function chkOn(){const n=performance.now();if(n-chk>300){chk=n;let v=true;try{const p=JSON.parse(localStorage.getItem('arcade_pref')||'{}');v=!(p.snd===0||p.snd===false)}catch(e){}on=v;if(mst)mst.gain.setTargetAtTime(on?.85:0,ac.currentTime,.05)}return on}
function out(g,pan,send){let n=g;if(pan&&ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=cl(pan,-1,1);n.connect(p);n=p}n.connect(bus);if(send){const s=ac.createGain();s.gain.value=send;n.connect(s);s.connect(rv)}}
function nz(o){if(vc>46&&!o.hi)return;const t0=ac.currentTime+(o.t||0),s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
 s.buffer=N[o.buf||'w'];s.loop=true;f.type=o.type||'bandpass';f.Q.value=o.q||1;f.frequency.setValueAtTime(o.f1,t0);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t0+o.d);
 g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(o.v,t0+(o.a||.004));g.gain.exponentialRampToValueAtTime(.0001,t0+o.d);s.connect(f);f.connect(g);
 if(o.am){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=o.am;lg.gain.value=o.v*.6;l.connect(lg);lg.connect(g.gain);l.start(t0);l.stop(t0+o.d+.05)}
 out(g,o.pan,o.send);vc++;s.onended=()=>vc--;s.start(t0,Math.random()*1.5);s.stop(t0+o.d+.05)}
function ob(o){if(vc>46&&!o.hi)return;const t0=ac.currentTime+(o.t||0),s=ac.createOscillator(),g=ac.createGain();
 s.type=o.type||'sine';s.frequency.setValueAtTime(o.f1,t0);if(o.f2)s.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t0+o.d);
 g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(o.v,t0+(o.a||.004));g.gain.exponentialRampToValueAtTime(.0001,t0+o.d);
 let n=s;if(o.lp){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(o.lp,t0);if(o.lp2)f.frequency.exponentialRampToValueAtTime(o.lp2,t0+o.d);s.connect(f);n=f}
 n.connect(g);out(g,o.pan,o.send);vc++;s.onended=()=>vc--;s.start(t0);s.stop(t0+o.d+.05)}
function drop(t,v,pan){ob({t,d:.07,f1:RN(900,1700),f2:RN(300,520),v,pan,send:.3});nz({t,d:.03,f1:RN(2000,4200),q:3,v:v*.8,pan})}
function hiss(pan,v){const d=RN(.35,.6);nz({d,f1:5800,q:.9,v,a:.07,pan,send:.15,am:27});nz({d,f1:4200,type:'highpass',v:v*.5,a:.09,pan})}
function beat(t,v){ob({t,d:.16,f1:64,f2:38,v:.5*v,hi:1});ob({t:t+.02,d:.12,f1:95,f2:48,v:.22*v,hi:1});ob({t:t+.17,d:.13,f1:58,f2:36,v:.32*v,hi:1})}
function chime(t,f,v){ob({t,d:1.3,f1:f,v,send:.5,hi:1});ob({t,d:.9,f1:f*2.01,v:v*.4,send:.5,hi:1});ob({t,d:.5,type:'triangle',f1:f*3,v:v*.18,hi:1})}
function splat(z,pan,v){
 ob({d:.28+.3*z,f1:130-40*z,f2:34,v:.55*v,hi:1,pan,send:.15});
 nz({d:.03,f1:3200,type:'lowpass',v:.4*v,pan});
 nz({d:.26+.22*z,f1:950,f2:240,q:7,v:.5*v,buf:'p',am:21,pan,send:.25});
 nz({t:.04,d:.2,f1:1700,f2:600,q:5,v:.28*v,buf:'p',am:34,pan,send:.2});
 for(let i=0;i<((5+z*5)|0);i++)nz({t:RN(0,.12),d:.012,f1:RN(2500,6000),type:'highpass',v:RN(.1,.2)*v,pan});
 for(let i=0;i<((7+z*8)|0);i++)drop(RN(.06,.75+z*.4),RN(.04,.1)*v,pan);
 nz({t:.1,d:.5+.4*z,f1:600,f2:280,q:3,v:.1*v,buf:'b',am:13,pan,send:.35})}
function loop(buf,type,f,q,rate){const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),am=ac.createGain(),g=ac.createGain(),r={};
 s.buffer=N[buf];s.loop=true;fl.type=type;fl.frequency.value=f;fl.Q.value=q;g.gain.value=0;s.connect(fl);fl.connect(am);am.connect(g);g.connect(bus);
 if(rate){am.gain.value=.5;const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=rate;lg.gain.value=.5;l.connect(lg);lg.connect(am.gain);l.start();r.l=l}
 s.start();r.fl=fl;r.g=g;return r}
function osc(type,f,lp,rate){const o=ac.createOscillator(),fl=ac.createBiquadFilter(),am=ac.createGain(),g=ac.createGain();o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=lp;g.gain.value=0;o.connect(fl);fl.connect(am);am.connect(g);g.connect(bus);
 am.gain.value=1;if(rate){am.gain.value=.55;const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=rate;lg.gain.value=.45;l.connect(lg);lg.connect(am.gain);l.start()}o.start();return{o,g}}
function init(){
 if(ac)return ac;try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
 mst=ac.createGain();mst.gain.value=.85;muff=ac.createBiquadFilter();muff.type='lowpass';muff.frequency.value=20000;
 const cp=ac.createDynamicsCompressor();cp.threshold.value=-16;cp.knee.value=18;cp.ratio.value=5;cp.attack.value=.004;cp.release.value=.2;
 mst.connect(muff);muff.connect(cp);cp.connect(ac.destination);bus=ac.createGain();bus.connect(mst);
 const len=(ac.sampleRate*1.8)|0,ib=ac.createBuffer(2,len,ac.sampleRate);
 for(let c=0;c<2;c++){const d=ib.getChannelData(c);let lp=0;for(let i=0;i<len;i++){const k=i/len;lp+=((Math.random()*2-1)-lp)*(.5-.42*k);d[i]=lp*Math.pow(1-k,2.6)*2}}
 const cv=ac.createConvolver();cv.buffer=ib;rv=ac.createGain();rv.connect(cv);cv.connect(mst);
 const mkN=f=>{const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);f(b.getChannelData(0));return b};
 N.w=mkN(d=>{for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1});
 N.p=mkN(d=>{let a=0,b=0,c=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;a=.99765*a+w*.099;b=.963*b+w*.2965;c=.57*c+w*1.0526;d[i]=(a+b+c+w*.18)*.2}});
 N.b=mkN(d=>{let l=0;for(let i=0;i<d.length;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}});
 L.sl=loop('p','bandpass',1700,1.1,6);L.bo=loop('w','bandpass',800,1.4);L.wd=loop('b','lowpass',420,.7,.11);L.dg=loop('b','lowpass',140,.8);
 L.hum=osc('sawtooth',62,260);L.dr1=osc('sine',55,200);L.dr2=osc('sine',55.7,200);L.rg=osc('triangle',82,500,7);L.rg2=osc('sawtooth',123.5,700,5.3);
 const un=()=>{if(ac.state==='suspended')ac.resume()};['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,un,{passive:true}));
 document.addEventListener('visibilitychange',()=>{if(document.hidden)ac.suspend();else un()});return ac}
['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,()=>init(),{passive:true,capture:true}));
document.addEventListener('pointerdown',e=>{if(ac&&e.target.closest&&e.target.closest('button'))SND.ui()},true);
const ok=()=>ac&&chkOn();
const A={
 ui(){if(!ok())return;ob({d:.05,f1:620,f2:430,v:.07,hi:1});nz({d:.015,f1:3500,q:2,v:.06,hi:1})},
 deny(){if(!ok())return;ob({d:.22,type:'sawtooth',f1:150,f2:105,v:.08,lp:600,hi:1})},
 equip(){if(!ok())return;nz({d:.14,f1:3000,f2:9000,q:2,v:.1,hi:1});chime(.03,nt(523,0),.06)},
 buy(r){if(!ok())return;const n=2+(RI[r]||0);chime(0,988,.08);chime(.08,1319,.07);
  for(let i=0;i<n;i++)ob({t:.12+i*.07,d:.4,type:'triangle',f1:nt(523,SC[i]),v:.05,send:.4,hi:1});nz({t:.1,d:.5,f1:6000,type:'highpass',v:.04*n,a:.1,hi:1});
  if((RI[r]||0)>=3){ob({d:.9,f1:62,f2:36,v:.35,hi:1,send:.3});for(const f of[110,165,220])ob({t:.1,d:1.5,type:'sawtooth',f1:f,v:.04,a:.2,lp:900,hi:1,send:.5})}},
 pause(p){if(!ok())return;if(p){ob({d:.14,f1:440,f2:300,v:.07,hi:1});ob({t:.09,d:.16,f1:330,f2:220,v:.06,hi:1})}else{ob({d:.12,f1:300,f2:480,v:.07,hi:1});ob({t:.09,d:.14,f1:400,f2:640,v:.06,hi:1})}},
 drip(){if(ok()&&vc<30)drop(0,.035,0)},
 start(){if(!ok())return;const n=ac.currentTime;muff.frequency.cancelScheduledValues(n);muff.frequency.setTargetAtTime(20000,n,.05);mile=0;
  nz({d:.55,f1:250,f2:3000,q:1.5,v:.14,buf:'p',a:.12,send:.3,hi:1});ob({d:.4,f1:110,f2:240,v:.18,a:.05,hi:1});
  [392,494,587].forEach((f,i)=>ob({t:i*.07,d:.35,type:'triangle',f1:f,v:.05,send:.4,hi:1}));hiss(0,.06)},

    if(sx<-rr*2-4||sx>W+rr*2+4||sy<-rr*2-4||sy>H+rr*2+4)continue;

    else if(s.skin.aura&&i%4===0){x.fillStyle='hsla('+s.hue+',90%,60%,.16)';x.beginPath();x.arc(sx,sy,rr*1.9,0,TAU);x.fill()}

  const ca=Math.cos(s.ang),sa=Math.sin(s.ang);

  for(const side of[-1,1]){
    const ex=sx+ca*rr*.35-sa*rr*.5*side,ey=sy+sa*rr*.35+ca*rr*.5*side;
    x.fillStyle=rg?'#ff3b3b':'#fff';x.beginPath();x.arc(ex,ey,rr*.34,0,TAU);x.fill();
    x.fillStyle='#161423';x.beginPath();x.arc(ex+ca*rr*.12,ey+sa*rr*.12,rr*.17,0,TAU);x.fill();
  }

    for(let k=0;k<3;k++){const aa=t*3.2+k*2.094,ox2=sx+Math.cos(aa)*rr*2.2,oy2=sy+Math.sin(aa)*rr*2.2;
      x.fillStyle=hsla(gh+k*40,100,72,.9);x.beginPath();x.arc(ox2,oy2,Math.max(1.5,rr*.15),0,TAU);x.fill()}
  }

  }
}

function postGlitch(gl){

function draw(){

  {

    x.strokeStyle=hsla((t*60)%360,100,60,.55+dang*.4);x.lineWidth=(5+dang*8)*z;x.stroke();

    const m=motes[i],yy=((m.y-t*m.v)%1+1)%1,xx=((m.x+Math.sin(t*.6+m.w)*.02)%1+1)%1;

  $('shop').hidden=true;$('pz').hidden=true;$('main').hidden=false;
  $('ttl').textContent=over?'مردی!':'مارخور';$('ttl').style.color=over?'#ff6b8a':'#7ae7c7';
  $('sub').innerHTML=over?('طول نهایی: '+Math.floor(P.mass)+' &nbsp;|&nbsp; کشته‌ها: '+P.kills+'<br>امتیاز کسب‌شده: +'+earned+' &nbsp;|&nbsp; رکورد: '+best)
    :'با جوی‌استیک (یا موس) جهت مار رو تعیین کن و غذا بخور.<br>سر مار دیگه‌ای که به بدن تو بخوره، می‌میره.<br>با امتیازها اسکین‌های کمیاب تا اسطوره‌ای بخر!';
  $('play').textContent=over?'بازی دوباره':'شروع بازی';
  wal();$('ui').style.display='flex';
}
const prevs=[];let shopOn=false;
function renderShop(){
  const g=$('grid');g.innerHTML='';prevs.length=0;
  for(const k of SKINS){
    const own=save.owned.includes(k.id),on=save.sel===k.id,rr=RAR[k.r];
    const d=document.createElement('div');d.className='sk'+(on?' on':'');
    const cv=document.createElement('canvas');cv.width=260;cv.height=88;d.appendChild(cv);
    d.insertAdjacentHTML('beforeend','<b>'+k.n+'</b><i style="color:'+rr.col+'">'+rr.n+'</i>');
    const b=document.createElement('button');
    b.textContent=on?'فعال ✓':own?'انتخاب':'خرید '+k.p;
    b.disabled=on||(!own&&save.wallet<k.p);
    b.onclick=()=>{if(own){save.sel=k.id;SND.equip()}else if(save.wallet>=k.p){save.wallet-=k.p;save.owned.push(k.id);save.sel=k.id;SND.buy(k.r)}else SND.deny();sv();wal();renderShop()};
    d.appendChild(b);g.appendChild(d);prevs.push([cv,k]);
  }
}
function prevLoop(now){
  if(!shopOn)return;
  for(const[cv,k]of prevs){
    const q=cv.getContext('2d');q.clearRect(0,0,260,88);
    for(let i=13;i>=0;i--){
      const px=236-i*17,py=44+Math.sin(i*.55)*18,r=17-i*.35;
      if(k.aura&&i%4===0){q.fillStyle='hsla('+k.h+',90%,60%,.18)';q.beginPath();q.arc(px,py,r*1.7,0,TAU);q.fill()}
      q.fillStyle=k.col(i,14,now/1000);q.beginPath();q.arc(px,py,r,0,TAU);q.fill();
    }
    q.fillStyle='#fff';q.beginPath();q.arc(242,37,6,0,TAU);q.arc(242,53,6,0,TAU);q.fill();
    q.fillStyle='#161423';q.beginPath();q.arc(244,37,3,0,TAU);q.arc(244,53,3,0,TAU);q.fill();
  }
  requestAnimationFrame(prevLoop);
}
$('play').onclick=()=>{if(st==='ready'||(st==='over'&&t-overAt>.8))start()};
$('skbtn').onclick=()=>{$('main').hidden=true;$('shop').hidden=false;renderShop();shopOn=true;requestAnimationFrame(prevLoop)};
$('back').onclick=()=>{$('shop').hidden=true;$('main').hidden=false;shopOn=false;wal()};
$('resume').onclick=()=>setPause(false);
$('quit').onclick=()=>{paused=false;$('pz').hidden=true;P.quit=true;kill(P,null)};
showUI(false);

ptr={x:W/2+100,y:H/2};
$('home').onclick=$('home2').onclick=()=>emit('home',0);
const rotEl=document.getElementById('rot');
const isBlocked=()=>matchMedia('(pointer:coarse)').matches&&innerWidth>innerHeight*1.02;
let last=performance.now();
function loop(n){
  const rdt=Math.min((n-last)/1000,.05);last=n;
  gAvg+=(rdt-gAvg)*.05;
  if(gAvg>.027&&fxQ>.4)fxQ=Math.max(.4,fxQ-.01);else if(gAvg<.019&&fxQ<1)fxQ=Math.min(1,fxQ+.004);
  const bl=isBlocked();rotEl.style.display=bl?'flex':'none';
  ts+=(1-ts)*Math.min(1,rdt*2.4);
  if(!paused&&!bl){if(hitStop>0){hitStop-=rdt;fxUpdate(rdt*.2)}else update(rdt*ts)}
  follow();draw();
  if(st==='over'&&!uiShown&&t-overAt>.8){uiShown=true;showUI(true)}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
